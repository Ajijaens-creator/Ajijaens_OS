<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo"><img src="__LOGO__" alt="Aji Jaens"></div>
    <div style="padding:0 20px 14px">
      <div style="font-family:var(--fd);font-size:19px;font-weight:600;line-height:1.2">Content Studio</div>
      <div class="mini" style="margin-top:2px">Ruang kerja tim konten</div>
    </div>
    <nav class="sb-nav" id="nav"></nav>
    <div class="sb-foot">
      <button class="icobtn" onclick="toggleTheme()" title="Ganti tema" aria-label="Ganti tema terang/gelap">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      <button class="icobtn" onclick="syncPanel()" title="Sinkronisasi" aria-label="Panel sinkronisasi">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18 15 15 0 010-18"/></svg></button>
      <span class="mini" style="margin-left:auto">v1.0</span>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="topbar">
      <button class="icobtn tb-menu" onclick="document.getElementById('sidebar').classList.add('on');document.getElementById('scrim').classList.add('on')" aria-label="Buka menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div style="font-weight:700;font-size:14px">Jaens Content Studio</div>
      <div class="tb-right">
        <button class="btn gold sm" onclick="openForm('CNT')">+ Konten</button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="ov" id="modalOv"><div class="sheet" id="modalSheet"></div></div>
<div class="toast" id="toast"></div>
