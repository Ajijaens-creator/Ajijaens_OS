/* ---------------- pengumpul sinyal ---------------- */
function aiHasData(){
  return ['LOG','TSK','MTG','PER','INT','PRO','MLS','DEC','RIT','GOL','KNW','BUS','OPS','CNT','FAM','EVT','TRP'].some(t => recs(t).length);
}
function aiSignals(){
  const T = todayISO();
  const openT = openTsk();
  const projs = recs('PRO').map(p => Object.assign({ p }, projStats(p)));
  const rits  = recs('RIT').map(r => Object.assign({ r }, ritStat(r)));
  const logs7 = recs('LOG').filter(l => l.date && daysBetween(l.date, T) <= 7 && l.date <= T);
  const prom  = promises();
  const lastLog = recs('LOG').map(l => l.date).filter(Boolean).sort().pop();
  return {
    T,
    log: logFor(T), lastLog,
    sinceLog: lastLog ? daysBetween(lastLog, T) : null,
    energy7: logs7.length ? Math.round(logs7.reduce((s,l) => s + (Number(l.energy)||0), 0) / logs7.length * 10) / 10 : null,
    nLog7: logs7.length,
    openT, lateT: openT.filter(t => t.due && t.due < T), dueT: openT.filter(t => t.due === T),
    noOwnerT: openT.filter(t => !t.owner), p1: openT.filter(t => t.pri && t.pri.indexOf('P1') === 0),
    done7: recs('TSK').filter(t => t.status === 'Selesai' && t.done && daysBetween(t.done, T) <= 7),
    mtg: mtgFor(T),
    projs, projLate: projs.filter(x => x.overdue), projRisk: projs.filter(x => x.late > 0),
    projStall: projs.filter(x => x.p.status === 'Berjalan' && x.n === 0),
    msLate: recs('MLS').filter(m => m.status === 'Belum tercapai' && m.date && m.date < T),
    contacts: dueContacts(), cold: dueContacts().filter(x => x.st === 'cold'),
    prom, promLate: prom.filter(i => i.nextDate && i.nextDate < T),
    decDue: decNeedsReview(), decNoAssume: recs('DEC').filter(d => !d.assume),
    rits, ritBroken: rits.filter(x => x.st === 'broken'), ritDue: rits.filter(x => x.st === 'due'),
    wl: workload(), goals: recs('GOL'), goalsLate: recs('GOL').filter(g => g.status === 'Tertinggal'),
    cntLate: (typeof cntLate === 'function' ? cntLate() : []),
    opsCrit: (typeof opsOpen === 'function' ? opsOpen().filter(o => o.sev === 'Kritis') : []),
    famSoon: recs('FAM').filter(x => x.dob).map(x => Object.assign({ f:x }, nextAnniv(x.dob) || {}))
              .filter(x => x.inDays !== undefined && x.inDays <= 7),
    tripNext: recs('TRP').map(x => Object.assign({ t:x }, tripStat(x)))
              .filter(x => x.upcoming && x.inDays <= 14).sort((a,b) => a.inDays - b.inDays)
  };
}
const nOr = (n, one, many) => n + ' ' + (many || one);

/* ---------------- kartu insight ---------------- */
/* type: FACT   = dihitung langsung dari record Anda
   type: INFER  = tafsiran saya atas angka itu — boleh Anda tolak */
function aiInsights(){
  const s = aiSignals(), out = [];
  const add = (type, conf, c, title, body, act, go_) => out.push({ type, conf, c, title, body, act, go: go_ });

  if(s.lateT.length){
    const oldest = s.lateT.slice().sort((a,b) => a.due < b.due ? -1 : 1)[0];
    add('FACT','CONFIRMED','red', nOr(s.lateT.length,'tugas') + ' lewat tenggat',
      `Tertua: "${h(oldest.n)}" — terlambat ${daysBetween(oldest.due, s.T)} hari.`,
      'Buka papan tugas', "TF={q:'',st:'late',owner:'',proj:'',pri:'',grp:'due'};PJ_TAB='tasks';go('projects')");
  }
  if(s.promLate.length){
    const p0 = s.promLate[0], per = p0.per ? recById(p0.per) : null;
    add('FACT','CONFIRMED','red', nOr(s.promLate.length,'janji') + ' lewat tanggalnya',
      `Yang tertua: "${h(p0.next)}"${per ? ' kepada ' + h(SCHEMA.PER.t(per)) : ''} — ${daysBetween(p0.nextDate, s.T)} hari lalu.`,
      'Buka Network', "NW_TAB='due';go('network')");
  }
  if(s.decDue.length){
    add('FACT','CONFIRMED','orange', nOr(s.decDue.length,'keputusan') + ' menunggu peninjauan',
      `Yang paling lama: "${h(s.decDue[0].n)}" — jadwal tinjauan ${dOnly(s.decDue[0].review)}.`,
      'Tinjau sekarang', `reviewDec('${s.decDue[0].id}')`);
  }
  if(s.ritBroken.length){
    add('FACT','CONFIRMED','red', nOr(s.ritBroken.length,'ritme') + ' terputus',
      s.ritBroken.map(x => `${h(x.r.n)} (lewat ${x.over} hari)`).join(' · '),
      'Buka Ritme', "OS_TAB='rit';go('os')");
  }
  if(s.cold.length){
    add('FACT','CONFIRMED','orange', nOr(s.cold.length,'relasi') + ' mendingin',
      s.cold.slice(0,3).map(x => `${h(SCHEMA.PER.t(x.p))} (${x.over} hari lewat ritmenya)`).join(' · '),
      'Buka Network', "NW_TAB='due';go('network')");
  }
  if(s.msLate.length){
    add('FACT','CONFIRMED','red', nOr(s.msLate.length,'milestone') + ' terlewat tanggalnya',
      s.msLate.slice(0,3).map(m => h(m.n)).join(' · ') + '.',
      'Buka Milestone', "PJ_TAB='ms';go('projects')");
  }
  if(s.opsCrit.length){
    add('FACT','CONFIRMED','red', nOr(s.opsCrit.length,'isu kritis') + ' masih terbuka',
      s.opsCrit.slice(0,3).map(o => h(o.n)).join(' · ') + '.',
      'Buka Business Empire', "BF={unit:'',sev:'Kritis',st:'open'};BZ_TAB='iss';go('business')");
  }
  if(s.cntLate.length){
    add('FACT','CONFIRMED','orange', nOr(s.cntLate.length,'konten') + ' lewat tanggal tayang',
      s.cntLate.slice(0,3).map(c => h(c.n)).join(' · ') + '.',
      'Buka pipeline konten', "go('brand')");
  }
  if(s.famSoon.length){
    add('FACT','CONFIRMED','pink', nOr(s.famSoon.length,'ulang tahun keluarga') + ' dalam 7 hari',
      s.famSoon.map(x => h(SCHEMA.FAM.t(x.f)) + ' (' + (x.inDays === 0 ? 'hari ini' : x.inDays + ' hari') + ', ke-' + x.years + ')').join(' · ') + '.',
      'Buka Family', "go('family')");
  }
  if(s.tripNext.length && s.tripNext[0].items.length && s.tripNext[0].pct < 100){
    const tr = s.tripNext[0];
    add('FACT','CONFIRMED','blue', 'Persiapan ' + h(SCHEMA.TRP.t(tr.t)) + ' baru ' + tr.pct + '%',
      'Berangkat ' + relDay(tr.t.start).toLowerCase() + ' — ' + (tr.items.length - tr.done) + ' langkah persiapan belum dicentang.',
      'Buka Travel', "go('travel')");
  }
  if(s.sinceLog !== null && s.sinceLog >= 3){
    add('FACT','CONFIRMED','blue', `Check-in terakhir ${s.sinceLog} hari lalu`,
      'Tanpa check-in, kartu energi dan fokus di My Day kosong — dan tren tidak bisa dihitung.',
      'Check-in sekarang', "openForm('LOG')");
  }

  /* --- tafsiran, bukan fakta --- */
  const heavy = s.wl.filter(x => x.id !== '_none' && x.open >= 5);
  if(heavy.length){
    add('INFER','MEDIUM','orange', 'Beban menumpuk pada ' + h(heavy[0].name),
      heavy[0].open + ' tugas terbuka' + (heavy[0].late ? ', ' + heavy[0].late + ' di antaranya terlambat' : '') +
      '. Angkanya fakta; kesimpulan bahwa ini kelebihan beban adalah tafsiran saya — Anda yang tahu kapasitas sebenarnya.',
      'Lihat beban tim', "PJ_TAB='load';go('projects')");
  }
  if(s.projStall.length){
    add('INFER','MEDIUM','orange', nOr(s.projStall.length,'proyek') + ' berstatus Berjalan tanpa satu pun tugas',
      s.projStall.map(x => h(SCHEMA.PRO.t(x.p))).join(' · ') + '. Selama tidak ada tugas, progresnya tidak bisa dihitung dan hanya bergantung angka manual.',
      'Buka papan proyek', "PJ_TAB='board';go('projects')");
  }
  if(s.noOwnerT.length >= 3){
    add('INFER','MEDIUM','blue', nOr(s.noOwnerT.length,'tugas') + ' belum punya penanggung jawab',
      'Tugas tanpa pemilik cenderung menjadi tugas Anda sendiri secara diam-diam. Ini pola yang saya lihat di data, bukan aturan.',
      'Lihat tugas itu', "TF={q:'',st:'open',owner:'_none',proj:'',pri:'',grp:'status'};PJ_TAB='tasks';go('projects')");
  }
  if(s.decNoAssume.length && recs('DEC').length >= 3){
    add('INFER','MEDIUM','purple', nOr(s.decNoAssume.length,'keputusan') + ' tanpa asumsi tertulis',
      'Saat ditinjau nanti, keputusan ini hanya bisa dinilai dari hasilnya — bukan dari apakah cara berpikirnya benar.',
      'Buka decision log', "OS_TAB='dec';go('os')");
  }
  if(s.goalsLate.length){
    add('INFER','MEDIUM','red', nOr(s.goalsLate.length,'sasaran') + ' Anda tandai tertinggal',
      s.goalsLate.slice(0,3).map(g => h(g.n)).join(' · ') + '. Status ini Anda sendiri yang menetapkan.',
      'Buka Goal', "OS_TAB='goal';go('os')");
  }
  return out;
}

    s.dueT.length ? `${nOr(s.dueT.length,'tugas')} jatuh tempo hari ini.` : '',
    s.p1.length ? `${nOr(s.p1.length,'tugas')} bertanda P1 masih terbuka.` : ''

  ${sec('flag','Yang menagih','red', [

    s.promLate.length ? `${nOr(s.promLate.length,'janji')} kepada orang lain lewat tanggalnya.` : '',
    s.decDue.length ? `${nOr(s.decDue.length,'keputusan')} menunggu peninjauan.` : '',
    s.ritBroken.length ? `${nOr(s.ritBroken.length,'ritme')} terputus.` : '',
    s.cold.length ? `${nOr(s.cold.length,'relasi')} mendingin.` : '',
    s.msLate.length ? `${nOr(s.msLate.length,'milestone')} terlewat.` : ''
  ].filter(Boolean).length ? [
    s.lateT.length ? `${nOr(s.lateT.length,'tugas')} lewat tenggat.` : '',
    s.promLate.length ? `${nOr(s.promLate.length,'janji')} kepada orang lain lewat tanggalnya.` : '',
    s.decDue.length ? `${nOr(s.decDue.length,'keputusan')} menunggu peninjauan.` : '',
    s.ritBroken.length ? `${nOr(s.ritBroken.length,'ritme')} terputus.` : '',
    s.cold.length ? `${nOr(s.cold.length,'relasi')} mendingin.` : '',

/* ---------------- mesin jawaban ---------------- */
function aiFindPerson(s){
  const list = recs('PER');
  return list.find(p => s.includes(String(p.n).toLowerCase())) ||
         list.find(p => String(p.n).toLowerCase().split(' ').filter(w => w.length > 3).some(w => s.includes(w)));
}
function aiAnswerLive(q){
  const s = String(q).toLowerCase().trim();
  const g = aiSignals();
  const has = aiHasData();
  const bullets = arr => arr.map(x => '• ' + x).join('\n');
  const src = t => `\n\n_Sumber: ${t} — record Anda sendiri._`;

  /* pertanyaan tentang satu orang */
  const per = aiFindPerson(s);
  if(per && /kapan|terakhir|siapa|bagaimana|apa kabar|hubungi|temu|bertemu|janji|tugas/.test(s)){
    const cs = contactStat(per);
    const op = promises().filter(i => i.per === per.id);
    const tk = openTsk().filter(t => t.owner === per.id);
    return `**${SCHEMA.PER.t(per)}** — ${[per.pos, per.org].filter(Boolean).join(', ') || per.cat || '—'}\n\n` +
      (cs.last ? `Terakhir tercatat ${dOnly(cs.last)} (${cs.days} hari lalu)${cs.target ? `, ritme yang Anda tetapkan ${per.cadence} — status **${ST_LABEL[cs.st]}**` : ''}.`
               : 'Belum ada interaksi yang tercatat dengannya.') +
      `\n\n${cs.n} interaksi tercatat, ${cs.recent} dalam 12 bulan terakhir (tier ${cs.tier}).` +
      (cs.ints.length ? `\n\nTerakhir dibahas: "${cs.ints[0].topic || '—'}"${cs.ints[0].outcome ? ` — ${cs.ints[0].outcome}` : ''}.` : '') +
      (op.length ? `\n\n**Janji Anda yang belum ditepati:**\n${bullets(op.map(i => i.next + (i.nextDate ? ' (' + relDay(i.nextDate).toLowerCase() + ')' : '')))}` : '') +
      (tk.length ? `\n\n**Tugas yang dia pegang:** ${tk.length} terbuka.` : '') +
      src('Network');
  }

  const rules = [
    { k:['prioritas','tiga hal','3 hal','paling penting','hari ini apa'], a:() => {
        const t3 = top3(g.T);
        if(!t3.length) return has ? 'Tidak ada tugas terbuka untuk hari ini. Papan tugas Anda bersih.' + src('Projects')
                                  : 'Belum ada tugas di sistem, jadi belum ada prioritas yang bisa saya susun.';
        return `Tiga hal terpenting hari ini, dipilih dari prioritas dan tenggat yang Anda tetapkan sendiri:\n\n` +
          t3.map((t,i) => `${i+1}. **${t.n}** — ${[t.pri || '', t.due ? 'tenggat ' + relDay(t.due).toLowerCase() : 'tanpa tenggat'].filter(Boolean).join(' · ')}`).join('\n') +
          src('My Day & Projects'); } },
    { k:['terlambat','lewat tenggat','telat','tertunda'], a:() => g.lateT.length
        ? `${nOr(g.lateT.length,'tugas')} lewat tenggat:\n\n` +
          bullets(g.lateT.slice(0,8).map(t => `**${t.n}** — terlambat ${daysBetween(t.due, g.T)} hari${t.owner ? ', ' + ownerName(t.owner) : ''}`)) + src('Projects')
        : 'Tidak ada tugas yang lewat tenggat.' + (has ? src('Projects') : '') },
    { k:['hubungi','follow up','relasi','dingin','mendingin','jaringan','network'], a:() => g.contacts.length
        ? `${nOr(g.contacts.length,'kontak')} sudah lewat ritme yang Anda tetapkan:\n\n` +
          bullets(g.contacts.slice(0,8).map(x => `**${SCHEMA.PER.t(x.p)}** — ${x.st === 'never' ? 'belum pernah tercatat' : x.over + ' hari lewat dari ritme ' + (x.p.cadence||'').toLowerCase()}`)) + src('Network')
        : recs('PER').length ? 'Tidak ada relasi yang lewat ritmenya.' + src('Network')
        : 'Belum ada kontak di sistem. Isi kontak dan tetapkan ritmenya dulu — baru saya bisa menagih.' },
    { k:['janji','komitmen','saya berjanji','belum saya tepati'], a:() => g.prom.length
        ? `${nOr(g.prom.length,'janji')} belum ditepati${g.promLate.length ? `, ${g.promLate.length} sudah lewat tanggalnya` : ''}:\n\n` +
          bullets(g.prom.slice(0,8).map(i => { const p = i.per ? recById(i.per) : null;
            return `**${i.next}**${p ? ' — kepada ' + SCHEMA.PER.t(p) : ''}${i.nextDate ? ' (' + relDay(i.nextDate).toLowerCase() + ')' : ''}`; })) + src('Network')
        : 'Tidak ada janji yang menggantung.' + (recs('INT').length ? src('Network') : '') },
    { k:['keputusan','decision','memutuskan','peninjauan','tinjau ulang','harus saya tinjau'], a:() => {
        if(!recs('DEC').length) return 'Belum ada keputusan tercatat. Catat keputusan besar beserta asumsinya — sistem akan menagihnya kembali pada tanggal peninjauan.';
        const judged = recs('DEC').filter(d => d.verdict);
        return (g.decDue.length ? `${nOr(g.decDue.length,'keputusan')} sudah waktunya ditinjau:\n\n` +
            bullets(g.decDue.map(d => `**${d.n}** — jadwal tinjauan ${dOnly(d.review)}, telat ${daysBetween(d.review, g.T)} hari`)) + '\n\n'
          : 'Tidak ada keputusan yang menunggu peninjauan.\n\n') +
          `Total ${recs('DEC').length} keputusan tercatat, ${judged.length} sudah dinilai` +
          (judged.length ? ` (${VERDICTS.map(v => judged.filter(d => d.verdict === v).length + ' ' + v.toLowerCase()).filter(x => x[0] !== '0').join(', ')})` : '') + '.' + src('Operating System'); } },
    { k:['ritme','terputus','rutin','review mingguan','kebiasaan','disiplin'], a:() => {
        if(!recs('RIT').length) return 'Belum ada ritme yang Anda tetapkan. Ritme adalah peninjauan berulang dengan daftar periksa — mingguan, bulanan, kuartalan.';
        return g.rits.map(x => `**${x.r.n}** (${x.r.freq}) — ${RIT_LABEL[x.st]}${x.keep !== null ? `, kedisiplinan 90 hari ${x.keep}%` : ''}`).join('\n') + src('Operating System'); } },
    { k:['proyek','project','bermasalah','risiko'], a:() => {
        if(!recs('PRO').length) return 'Belum ada proyek tercatat.';
        const worst = g.projs.slice().sort((a,b) => (b.late + (b.overdue?5:0)) - (a.late + (a.overdue?5:0)))[0];
        return `${nOr(g.projs.length,'proyek')} tercatat.\n\n` +
          (g.projLate.length ? `Lewat target: ${g.projLate.map(x => '**' + SCHEMA.PRO.t(x.p) + '**').join(', ')}.\n` : '') +
          (g.projRisk.length ? `Punya tugas terlambat: ${g.projRisk.map(x => SCHEMA.PRO.t(x.p) + ' (' + x.late + ')').join(', ')}.\n` : '') +
          (worst ? `\nPaling perlu perhatian: **${SCHEMA.PRO.t(worst.p)}** — progres ${worst.pct}%${worst.auto ? ` (${worst.done}/${worst.n} tugas selesai)` : ' (angka manual, belum ada tugas)'}.` : '') + src('Projects'); } },
    { k:['beban','kelebihan','siapa sibuk','delegasi','delegasikan','workload'], a:() => g.wl.length
        ? `Beban tugas terbuka:\n\n` + bullets(g.wl.map(x => `**${x.name}** — ${x.open} terbuka${x.late ? ', ' + x.late + ' terlambat' : ''}${x.p1 ? ', ' + x.p1 + ' P1' : ''}`)) +
          `\n\nAngka ini fakta dari papan tugas. Apakah ini berarti kelebihan beban — Anda yang tahu kapasitas sebenarnya.` + src('Projects')
        : 'Belum ada tugas terbuka, jadi belum ada beban yang bisa dihitung.' },
    { k:['energi','wellbeing','check-in','checkin','kondisi saya','tidur'], a:() => {
        if(!recs('LOG').length) return 'Belum ada check-in sama sekali. Begitu Anda mulai mencatat energi dan fokus harian, saya bisa menunjukkan trennya.';
        return (g.log ? `Hari ini Anda mencatat energi **${g.log.energy}/10**${g.log.focus ? `, fokus: ${g.log.focus}` : ''}.`
                      : `Belum check-in hari ini — terakhir ${g.sinceLog} hari lalu.`) +
          (g.energy7 !== null ? `\n\nRata-rata ${g.nLog7} check-in terakhir: **${String(g.energy7).replace('.',',')}/10**.` : '') +
          `\n\nIni angka yang Anda catat sendiri — saya tidak menafsirkannya jadi kesimpulan kesehatan.` + src('My Day'); } },
    { k:['agenda','jadwal','meeting','pertemuan hari ini'], a:() => g.mtg.length
        ? `${nOr(g.mtg.length,'agenda')} hari ini:\n\n` + bullets(g.mtg.map(m => `**${m.time || '—'}** ${m.n}${m.loc ? ' — ' + m.loc : ''}`)) + src('My Day')
        : 'Tidak ada agenda tercatat hari ini.' + (recs('MTG').length ? src('My Day') : ' Agenda diisi lewat entitas Meeting.') },
    { k:['sasaran','goal','target','visi'], a:() => {
        if(!recs('GOL').length) return 'Belum ada sasaran tercatat.';
        return `${nOr(g.goals.length,'sasaran')} tercatat` + (g.goalsLate.length ? `, ${g.goalsLate.length} Anda tandai tertinggal:\n\n` +
          bullets(g.goalsLate.map(x => `**${x.n}** — ${x.horizon || ''}`)) : '. Tidak ada yang Anda tandai tertinggal.') + src('Operating System'); } },
    { k:['ringkas','briefing','brief','pagi','apa yang harus saya tahu'], a:() => {
        const l = [];
        if(g.lateT.length) l.push(`${nOr(g.lateT.length,'tugas')} lewat tenggat`);
        if(g.promLate.length) l.push(`${nOr(g.promLate.length,'janji')} lewat tanggalnya`);
        if(g.decDue.length) l.push(`${nOr(g.decDue.length,'keputusan')} menunggu peninjauan`);
        if(g.ritBroken.length) l.push(`${nOr(g.ritBroken.length,'ritme')} terputus`);
        if(g.cold.length) l.push(`${nOr(g.cold.length,'relasi')} mendingin`);
        return (l.length ? `Yang menagih hari ini: ${l.join(', ')}.\n\n` : 'Tidak ada yang lewat jadwal hari ini.\n\n') +
          (g.mtg.length ? `${nOr(g.mtg.length,'agenda')} tercatat. ` : '') +
          (g.dueT.length ? `${nOr(g.dueT.length,'tugas')} jatuh tempo hari ini. ` : '') +
          `\n\nBuka Briefing Pagi untuk versi lengkapnya.` + src('semua modul'); } },
    { k:['konten','pipeline','tayang','posting'], a:() => {
        if(!recs('CNT').length) return 'Belum ada konten tercatat di pipeline.';
        const byS = {}; recs('CNT').forEach(c => byS[c.status] = (byS[c.status]||0)+1);
        return `${recs('CNT').length} konten di pipeline: ` + Object.keys(byS).map(k => byS[k] + ' ' + k.toLowerCase()).join(', ') + '.' +
          (g.cntLate.length ? `\n\n**Lewat tanggal tayang:**\n` + bullets(g.cntLate.map(c => `${c.n} (${h(c.channel||'—')}, ${dOnly(c.date)})`)) : '') + src('Branding & CRM'); } },
    { k:['keluarga','ulang tahun','anak','istri','famili'], a:() => {
        if(!recs('FAM').length && !recs('EVT').length) return 'Belum ada data keluarga tercatat.';
        const b60 = recs('FAM').filter(x => x.dob).map(x => Object.assign({ f:x }, nextAnniv(x.dob) || {}))
          .filter(x => x.inDays !== undefined && x.inDays <= 60).sort((a,b) => a.inDays - b.inDays);
        return (b60.length ? `Ulang tahun dalam 60 hari:\n\n` + bullets(b60.map(x => `**${SCHEMA.FAM.t(x.f)}** — ${x.inDays === 0 ? 'hari ini' : x.inDays + ' hari lagi'}, ke-${x.years}`))
                           : 'Tidak ada ulang tahun dalam 60 hari ke depan.') +
          `\n\n${recs('FAM').length} anggota keluarga dan ${recs('EVT').length} acara tercatat.` + src('Family'); } },
    { k:['perjalanan','trip','berangkat','travel'], a:() => {
        if(!recs('TRP').length) return 'Belum ada perjalanan tercatat.';
        if(!g.tripNext.length) return `${recs('TRP').length} perjalanan tercatat, tidak ada yang dijadwalkan dalam 14 hari ke depan.` + src('Travel');
        const t0 = g.tripNext[0];
        return `Berikutnya: **${SCHEMA.TRP.t(t0.t)}** — ${relDay(t0.t.start).toLowerCase()}${t0.nights ? ', ' + t0.nights + ' hari' : ''}.` +
          (t0.items.length ? `\n\nPersiapan ${t0.pct}% (${t0.done}/${t0.items.length} langkah).` : '\n\nBelum ada daftar persiapan.') + src('Travel'); } },
    { k:['isu','operasional','outlet','unit bisnis'], a:() => {
        if(typeof opsOpen !== 'function' || !recs('OPS').length) return 'Belum ada isu operasional tercatat.';
        const o = opsOpen();
        return `${o.length} isu terbuka di ${recs('BUS').length} unit.\n\n` +
          bullets(o.slice(0,8).map(x => { const u = x.unit ? recById(x.unit) : null;
            return `**${x.n}** — ${x.sev}${u ? ', ' + SCHEMA.BUS.t(u) : ''}${x.opened ? ', terbuka ' + daysBetween(x.opened, g.T) + ' hari' : ''}`; })) + src('Business Empire'); } },
    { k:['catatan','knowledge','pelajaran','arsip'], a:() => {
        if(!recs('KNW').length) return 'Belum ada catatan di arsip.';
        const wl = recs('KNW').filter(k => k.lesson);
        return `${recs('KNW').length} catatan tersimpan, ${wl.length} sudah punya kolom "pelajaran yang saya ambil".` +
          `\n\nUntuk mencari isi catatan, buka Knowledge lalu pakai "Tanya arsip saya" — di sana pencariannya menjangkau isi, bukan hanya judul.` + src('Knowledge'); } },
    { k:['berapa record','jumlah record','total record','record saya','data saya','berapa banyak record'], a:() => {
        const rows = SCH_ORDER.map(t => ({ t, n: recs(t).length })).filter(x => x.n);
        return rows.length ? `Record asli Anda saat ini:\n\n` + bullets(rows.map(x => `${SCHEMA[x.t].n}: **${x.n}**`)) +
          `\n\nSemuanya bertanda \`is_dummy = false\`.` : 'Belum ada satu pun record asli di sistem.'; } }
  ];

  const hit = rules.find(r => r.k.some(k => s.includes(k)));
  if(hit) return hit.a();

  /* cari di seluruh record sebelum menyerah */
  const found = [];
  SCH_ORDER.forEach(t => {
    recs(t).forEach(r => { if(JSON.stringify(r).toLowerCase().includes(s) && found.length < 6)
      found.push(`**${SCHEMA[t].t(r)}** — ${SCHEMA[t].n} · ${r.id}`); });
  });
  if(found.length) return `Saya tidak punya jawaban khusus untuk itu, tetapi menemukan ${found.length} record yang menyebutnya:\n\n${bullets(found)}\n\nBuka lewat ⌘K untuk melihat isinya.`;

  return `Saya tidak punya jawaban untuk itu dari data yang ada — dan saya tidak akan mengarang.\n\n` +
    (has ? `Yang bisa saya jawab dari record Anda sekarang: prioritas hari ini, tugas terlambat, siapa yang perlu dihubungi, janji yang belum ditepati, keputusan yang menunggu peninjauan, ritme yang terputus, proyek bermasalah, beban tim, agenda, sasaran, dan energi harian.`
         : `Belum ada record apa pun di sistem. Mulai dari satu check-in atau satu tugas — setelah itu saya punya bahan untuk menjawab.`);
}

const opsOpen = () => recs('OPS').filter(o => OPS_OPEN.indexOf(o.status) >= 0);
function unitStat(u){
  const iss = recs('OPS').filter(o => o.unit === u.id);
  const open = iss.filter(o => OPS_OPEN.indexOf(o.status) >= 0);
  const rits = recs('RIT').filter(r => r.unit === u.id).map(r => Object.assign({ r }, ritStat(r)));
  const projs = recs('PRO').filter(p => p.unit === u.id).map(p => Object.assign({ p }, projStats(p)));
  const tasks = recs('TSK').filter(t => projs.some(x => x.p.id === t.proj));
  const ages = open.filter(o => o.opened).map(o => daysBetween(o.opened, todayISO()));
  return {
    iss, open, crit: open.filter(o => o.sev === 'Kritis' || o.sev === 'Tinggi'),
    resolved90: iss.filter(o => o.status === 'Selesai' && o.resolved && daysBetween(o.resolved, todayISO()) <= 90).length,
    rits, ritDue: rits.filter(x => x.st === 'due' || x.st === 'broken' || x.st === 'never'),
    projs, projLate: projs.filter(x => x.overdue),
    tasksOpen: tasks.filter(t => DONE_ST.indexOf(t.status) < 0).length,
    oldest: ages.length ? Math.max.apply(null, ages) : 0,
    pic: u.pic ? recById(u.pic) : null
  };
}

function bzMap(){
  const all = recs('BUS');
  if(!all.length) return `<div class="empty">Belum ada unit.</div>`;
  const byType = {}, byCity = {}, byStatus = {};
  all.forEach(u => {
    byType[u.type || 'Tanpa jenis'] = (byType[u.type || 'Tanpa jenis'] || 0) + 1;
    if(u.city) byCity[u.city] = (byCity[u.city] || 0) + 1;
    byStatus[u.status || 'Tanpa status'] = (byStatus[u.status || 'Tanpa status'] || 0) + 1;
  });
  const palette = ['gold','blue','green','purple','teal','pink','orange','red','gray'];
  const typeItems = Object.keys(byType).sort((a,b) => byType[b] - byType[a]).map((k,i) => ({ n:k, v:byType[k], c:palette[i % palette.length] }));
  const staff = all.reduce((s,u) => s + (Number(u.staff) || 0), 0);
  const picMap = {};
  all.forEach(u => { if(u.pic) picMap[u.pic] = (picMap[u.pic] || 0) + 1; });
  const mxS = Math.max.apply(null, Object.values(byStatus)) || 1;
  return `
  <div class="g g4" style="margin-bottom:18px">
    ${[['Unit', all.length, 'gold','brief'],
       ['Jenis usaha', Object.keys(byType).length, 'purple','layers'],
       ['Kota', Object.keys(byCity).length, 'blue','pin'],
       ['Total tim tercatat', staff || '—', 'teal','users']].map(s=>`
      <div class="card"><div class="kpi">
        <div class="ic" style="width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 38px;background:${CT(s[2])};color:${CV(s[2])}">${ic(s[3])}</div>
        <div style="min-width:0"><b>${s[1]}</b><span>${s[0]}</span></div></div></div>`).join('')}
  </div>
  <div class="g g21 top" style="margin:0 0 18px">
    <div class="card">
      ${cardH('layers','Sebaran jenis usaha','purple')}
      <div class="flexr" style="gap:20px;align-items:center">
        ${donut(typeItems.map(x => ({ v:x.v, c:x.c })), 132)}
        <div style="flex:1;min-width:150px">${typeItems.map(x => `
          <div class="flexr" style="gap:8px;margin-bottom:6px;flex-wrap:nowrap">
            <span style="width:9px;height:9px;border-radius:3px;background:${CV(x.c)};flex:0 0 9px"></span>
            <span style="flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(x.n)}</span>
            <b style="font-size:12.5px;font-variant-numeric:tabular-nums">${x.v}</b></div>`).join('')}</div>
      </div>
    </div>
    <div class="card">
      ${cardH('flag','Tahap unit','blue')}
      ${Object.keys(byStatus).map(k => barLine(k, byStatus[k], mxS,
        k === 'Beroperasi' ? 'green' : k === 'Ramp-up' ? 'blue' : k === 'Ditutup' ? 'gray' : 'orange')).join('')}
      <div class="card-f"><span class="mini">Unit dalam tahap Ramp-up wajar bermargin rendah — itu bagian dari tahapnya, bukan otomatis masalah.</span></div>
    </div>
  </div>
  <div class="g g2" style="margin:0">
    <div class="card">
      ${cardH('users','Beban kepemimpinan','teal',`<span class="mini">${Object.keys(picMap).length} penanggung jawab</span>`)}

        const p = recById(id);

          <span style="min-width:0;flex:1"><span class="t" style="font-size:13px">${p ? h(SCHEMA.PER.t(p)) : id}</span>
            <span class="s">${recs('BUS').filter(u => u.pic === id).map(u => h(SCHEMA.BUS.t(u))).join(' · ')}</span></span>

        : '<p class="sub" style="margin:0">Belum ada unit yang punya penanggung jawab.</p>'}
    </div>
    <div class="card">
      ${cardH('pin','Sebaran lokasi','blue')}
      ${Object.keys(byCity).length ? `<div class="rows">${Object.keys(byCity).sort((a,b) => byCity[b] - byCity[a]).map(c => `
        <div class="row-i" style="cursor:default">
          <span style="width:3px;align-self:stretch;border-radius:3px;background:var(--blue);flex:0 0 3px"></span>

          <span class="rt"><span class="cnt">${byCity[c]}</span></span></div>`).join('')}</div>`

  </div>`;

/* Ulang tahun / peringatan tahunan berikutnya */
function nextAnniv(iso){
  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return null;
  const T = todayISO(), y = Number(T.slice(0,4)), mm = iso.slice(5,7), dd = iso.slice(8,10);
  let cand = y + '-' + mm + '-' + dd;
  if(!mkDate(y, Number(mm), Number(dd))) cand = y + '-03-01';          /* 29 Feb di tahun biasa */
  if(cand < T){
    cand = (y + 1) + '-' + mm + '-' + dd;
    if(!mkDate(y + 1, Number(mm), Number(dd))) cand = (y + 1) + '-03-01';
  }
  return { date: cand, inDays: daysBetween(T, cand), years: Number(cand.slice(0,4)) - Number(iso.slice(0,4)) };
}

SCHEMA.TRP.f.push({ k:'todoDone', l:'Persiapan yang sudah selesai', t:'text',
  hint:'Terisi otomatis saat Anda mencentang daftar persiapan.' });
const tripItems = t => String(t.todo || '').split('\n').map(s => s.trim()).filter(Boolean);
const tripDoneSet = t => String(t.todoDone || '').split(',').filter(x => x !== '');
function tripToggle(id, i){
  const t = recById(id); if(!t) return;
  const set = tripDoneSet(t), k = String(i);
  const at = set.indexOf(k);
  if(at >= 0) set.splice(at, 1); else set.push(k);
  t.todoDone = set.join(','); t._m.updated_at = new Date().toISOString();
  saveStore(); go(CUR);
}
function tripStat(t){
  const items = tripItems(t), done = tripDoneSet(t).length;
  const T = todayISO();
  const upcoming = t.start && t.start >= T;
  const ongoing = t.start && t.end && t.start <= T && t.end >= T;
  return { items, done, pct: items.length ? Math.round(Math.min(done, items.length) / items.length * 100) : null,
    upcoming, ongoing, past: t.end ? t.end < T : (t.start ? t.start < T : false),
    inDays: t.start ? daysBetween(T, t.start) : null,
    nights: (t.start && t.end) ? daysBetween(t.start, t.end) : null };
}

/* ================================================================
   ⑫ WELLBEING — tren dari check-in Anda sendiri
   ================================================================ */
function wellStats(){
  const T = todayISO();
  const logs = recs('LOG').filter(l => l.date).sort((a,b) => a.date < b.date ? 1 : -1);
  const last30 = logs.filter(l => daysBetween(l.date, T) <= 30 && l.date <= T);
  const last7 = logs.filter(l => daysBetween(l.date, T) <= 7 && l.date <= T);
  const avg = a => a.length ? Math.round(a.reduce((s,l) => s + (Number(l.energy)||0), 0) / a.length * 10) / 10 : null;
  /* rentetan hari berturut-turut yang punya check-in, dihitung mundur dari hari ini */
  let streak = 0, cur = T;
  const set = {}; logs.forEach(l => set[l.date] = 1);
  if(!set[T]) cur = shiftISO(T, -1);
  while(set[cur]){ streak++; cur = shiftISO(cur, -1); }
  return { logs, last30, last7, avg30: avg(last30), avg7: avg(last7), streak,
    coverage: Math.round(last30.length / 30 * 100),
    best: last30.slice().sort((a,b) => (Number(b.energy)||0) - (Number(a.energy)||0))[0],
    low: last30.slice().sort((a,b) => (Number(a.energy)||0) - (Number(b.energy)||0))[0] };
}

let KQ = { q:'', cat:'', tag:'' };
function kwCapture(){
  const el = document.getElementById('kwIn');

  r._m = { created_at:now, updated_at:now, created_by:DB.owner.name, updated_by:DB.owner.name, status:'ACTIVE',
    source_type:'MANUAL_ENTRY', source_id:'', source_url:'', privacy_level:'PRIVATE', is_dummy:false, is_archived:false, tags:[] };
  (STORE.rec.KNW = STORE.rec.KNW || []).unshift(r);

  el.value = '';
  toast('Tertangkap sebagai ' + r.id + ' — lengkapi kategori dan pelajarannya kapan saja');

function kwTags(){
  const m = {};
  recs('KNW').forEach(k => String(k.tags || '').split(',').map(s => s.trim()).filter(Boolean)
    .forEach(t => m[t] = (m[t] || 0) + 1));
  return m;
}
function kwFiltered(){
  let list = recs('KNW');
  if(KQ.cat) list = list.filter(k => k.cat === KQ.cat);
  if(KQ.tag) list = list.filter(k => String(k.tags || '').toLowerCase().includes(KQ.tag.toLowerCase()));
  if(KQ.q){ const q = KQ.q.toLowerCase();
    list = list.filter(k => (k.n + ' ' + (k.summary||'') + ' ' + (k.lesson||'') + ' ' + (k.src||'') + ' ' + (k.apply||'') + ' ' + (k.tags||'')).toLowerCase().includes(q)); }
  return list;
}
function kwAsk(){
  const el = document.getElementById('kwAskIn');
  const q = el ? (el.value || '').trim() : '';
  if(!q){ toast('Tulis pertanyaannya dulu'); return; }
  const terms = q.toLowerCase().split(/\s+/).filter(w => w.length > 3);

    const blob = (k.n + ' ' + (k.summary||'') + ' ' + (k.lesson||'') + ' ' + (k.apply||'') + ' ' + (k.tags||'')).toLowerCase();
    const words = blob.split(/[^a-z0-9]+/).filter(Boolean);
    /* kata utuh, bukan potongan — supaya "cara" tidak cocok dengan "tercapai" */
    return { k, score: terms.filter(t => words.indexOf(t) >= 0).length };

            <div style="font-size:13px;margin-top:3px">${h(x.k.lesson).replace(/\n/g,'<br>')}</div></div>` : ''}
          ${x.k.summary ? `<div style="margin-top:8px"><div class="mini" style="font-weight:700">RINGKASAN</div>

        </div>`).join('')

const rp = v => 'Rp ' + Number(v || 0).toLocaleString('id-ID') + ' Jt';
function finStats(){
  const T = todayISO(), y = T.slice(0,4);
  const tx = recs('TXN'), as = recs('AST');
  const num = v => Number(v) || 0;
  const inN  = tx.filter(t => t.dir === 'Masuk'), outN = tx.filter(t => t.dir === 'Keluar');
  const sum = a => a.reduce((s,t) => s + num(t.amount), 0);
  const m30 = tx.filter(t => t.date && daysBetween(t.date, T) <= 30 && t.date <= T);
  const byCat = {}, byMonth = {};
  tx.forEach(t => {
    const k = t.cat || 'Tanpa kategori';
    byCat[k] = (byCat[k] || 0) + (t.dir === 'Keluar' ? num(t.amount) : 0);
    if(t.date){ const mk = t.date.slice(0,7);
      byMonth[mk] = byMonth[mk] || { in:0, out:0 };
      byMonth[mk][t.dir === 'Masuk' ? 'in' : 'out'] += num(t.amount); }
  });
  const byAst = {};
  as.forEach(a => { const k = a.cat || 'Lainnya'; byAst[k] = (byAst[k] || 0) + num(a.value); });
  return { tx, as, in: sum(inN), out: sum(outN), net: sum(inN) - sum(outN),
    in30: sum(m30.filter(t => t.dir === 'Masuk')), out30: sum(m30.filter(t => t.dir === 'Keluar')),
    byCat, byMonth, byAst, astTotal: as.reduce((s,a) => s + num(a.value), 0), year: y };
}

VIEWS.operations = () => {
  const T = todayISO();
  const units = recs('BUS'), iss = recs('OPS');
  const open = typeof opsOpen === 'function' ? opsOpen() : [];
  const rits = recs('RIT').filter(r => r.unit).map(r => Object.assign({ r }, ritStat(r), { u: recById(r.unit) }));
  const head = liveHead('Operations', 'Pandangan lintas unit — kesehatan mesin operasional secara keseluruhan.',
    `<button class="btn gold sm" onclick="openForm('OPS')">${ic('plus')} Isu</button>
     <button class="btn ghost sm" onclick="go('business')">Per unit → Business Empire</button>`);
  const split = `<div class="statebar" style="margin:0 0 18px">
    <span class="dbadge" style="background:var(--blue)">PEMBAGIAN</span>
    <div style="flex:1;min-width:240px"><b>Business Empire</b> menjawab "bagaimana keadaan tiap unit".
      <b>Operations</b> menjawab "bagaimana mesinnya berjalan secara keseluruhan" — umur isu, kedisiplinan checklist, dan isu yang ditutup tanpa akar.
      Datanya sama, sudut pandangnya berbeda; tidak ada yang dientri dua kali.</div>
  </div>`;

  if(!units.length && !iss.length) return head + split + emptyCard('cog','orange','Belum ada data operasional',
    'Modul ini membaca unit, isu, dan checklist yang Anda catat di Business Empire. Begitu ada isinya, halaman ini menunjukkan pola lintas unit.',
    `<button class="btn solid" onclick="go('business')">Buka Business Empire</button>`) + demoTail(OPSV_BODY);

  const aged = open.filter(o => o.opened).map(o => ({ o, age: daysBetween(o.opened, T) })).sort((a,b) => b.age - a.age);
  const buckets = [['0–7 hari', aged.filter(x => x.age <= 7).length, 'green'],
                   ['8–30 hari', aged.filter(x => x.age > 7 && x.age <= 30).length, 'yellow'],
                   ['31–90 hari', aged.filter(x => x.age > 30 && x.age <= 90).length, 'orange'],
                   ['> 90 hari', aged.filter(x => x.age > 90).length, 'red']];
  const mxB = Math.max.apply(null, buckets.map(b => b[1]).concat([1]));
  const closedNoRoot = iss.filter(o => o.status === 'Selesai' && !o.root);
  const keepAvg = rits.filter(x => x.keep !== null);
  const avgKeep = keepAvg.length ? Math.round(keepAvg.reduce((s,x) => s + x.keep, 0) / keepAvg.length) : null;
  const byUnit = {};
  open.forEach(o => { const k = o.unit || '_none'; byUnit[k] = (byUnit[k] || 0) + 1; });
  const unitKeys = Object.keys(byUnit).sort((a,b) => byUnit[b] - byUnit[a]);

  return head + split + kpiRow([
    ['Isu terbuka lintas unit', open.length, open.length?'orange':'green','cog'],
    ['Isu tertua', aged.length ? aged[0].age + ' hari' : '—', aged.length && aged[0].age > 30 ? 'red' : 'gray','clock'],
    ['Kedisiplinan checklist', avgKeep === null ? '—' : avgKeep + '%', avgKeep === null ? 'gray' : avgKeep >= 80 ? 'green' : avgKeep >= 50 ? 'orange' : 'red','check'],
    ['Ditutup tanpa akar', closedNoRoot.length, closedNoRoot.length?'orange':'green','shield']]) + `

  <div class="g g21 top" style="margin:0 0 18px">
    <div class="card">
      ${cardH('clock','Umur isu terbuka','orange',`<span class="mini">makin ke kanan makin lama menganggur</span>`)}
      ${buckets.map(b => barLine(b[0], b[1], mxB, b[2])).join('')}
      ${aged.length ? `<div class="card-f"><span class="mini">Tertua: <b>${h(aged[0].o.n)}</b> — ${aged[0].age} hari${aged[0].o.unit && recById(aged[0].o.unit) ? ' di ' + h(SCHEMA.BUS.t(recById(aged[0].o.unit))) : ''}.</span></div>` : ''}
    </div>
    <div class="card">
      ${cardH('brief','Beban isu per unit','blue')}
      ${unitKeys.length ? unitKeys.map(k => {
        const u = k === '_none' ? null : recById(k);
        return barLine(u ? SCHEMA.BUS.t(u) : 'Tanpa unit', byUnit[k], byUnit[unitKeys[0]], 'blue'); }).join('')
        : '<p class="sub" style="margin:0">Tidak ada isu terbuka di unit mana pun.</p>'}
      <div class="card-f"><span class="mini">Unit dengan isu paling banyak belum tentu unit paling bermasalah — bisa juga unit yang paling rajin mencatat.</span></div>
    </div>
  </div>

  ${rits.length ? `<div class="card" style="margin-bottom:18px">
    ${cardH('check','Kedisiplinan checklist lintas unit','gold',`<span class="mini">${rits.length} checklist di ${new Set(rits.map(x => x.r.unit)).size} unit</span>`)}
    <div style="overflow-x:auto"><table class="tbl"><thead><tr>
      <th>Checklist</th><th>Unit</th><th>Frekuensi</th><th>Status</th><th style="text-align:right">Kedisiplinan 90 hari</th><th></th>
    </tr></thead><tbody>${rits.slice().sort((a,b) => (a.keep === null ? 999 : a.keep) - (b.keep === null ? 999 : b.keep)).map(x => `
      <tr><td><b>${h(x.r.n)}</b></td>
        <td>${x.u ? h(SCHEMA.BUS.t(x.u)) : '—'}</td>
        <td class="mini">${h(x.r.freq || '—')}</td>
        <td><span class="pill ${RIT_COLOR[x.st]}">${RIT_LABEL[x.st]}</span></td>
        <td style="text-align:right;font-variant-numeric:tabular-nums;${x.keep !== null && x.keep < 50 ? 'color:var(--red);font-weight:700' : ''}">${x.keep === null ? '—' : x.keep + '%'}</td>
        <td>${x.st !== 'paused' ? `<button class="btn ghost sm" onclick="runRitme('${x.r.id}')">Jalankan</button>` : ''}</td>
      </tr>`).join('')}</tbody></table></div>
  </div>` : ''}

  ${aged.length ? `<div class="card" style="margin-bottom:18px">
    ${cardH('cog','Isu paling lama menganggur','red',`<span class="cnt">${Math.min(aged.length, 10)}</span>`)}
    <div class="rows">${aged.slice(0,10).map(x => issueRow(x.o)).join('')}</div>
  </div>` : ''}

  ${closedNoRoot.length ? `<div class="statebar" style="margin:0">
    <span class="dbadge" style="background:var(--orange)">POLA</span>
    <div style="flex:1;min-width:240px"><b>${closedNoRoot.length} isu ditutup tanpa akar masalah tertulis.</b>
      Bila isu serupa muncul lagi nanti, tidak ada catatan yang bisa dipakai untuk melihat apakah ini pengulangan.</div>
  </div>` : ''}` + demoTail(OPSV_BODY, 'Tampilan contoh', 'Skor kesehatan unit contoh di bawah ini belum memakai data Anda.');
};

   ================================================================ */
const LOCK_KEY = 'ajios-lock';
let LOCKLOG = [];
try{ const s = localStorage.getItem(LOCK_KEY); if(s) LOCKLOG = JSON.parse(s) || []; }catch(e){}
if(!Array.isArray(LOCKLOG)) LOCKLOG = [];
/* Baris lama tanpa penanda fase berarti Phase 1 — riwayat lama tidak ditulis ulang. */
LOCKLOG.forEach(e => { if(!e.phase) e.phase = 1; });
function seedLock(p, area, reason){
  if(LOCKLOG.some(e => e.phase === p)) return;
  LOCKLOG.push({ act:'LOCK', phase:p, at: PHASES[p].lockedOn + 'T00:00:00.000Z', by: PHASES[p].lockedBy, area, reason });
}
seedLock(1, 'Seluruh cakupan Phase 1',
  'Phase 1 dinyatakan selesai: 15 modul, 22 entitas, 259 pemeriksaan lolos. Dikunci sesuai Master Transfer Pack — fase berikutnya tidak dijalankan sebelum fase berjalan ditinjau dan dikunci.');
seedLock(2, 'Seluruh cakupan Phase 2',
  'Phase 2 dinyatakan selesai: tautan balik universal, linimasa per record, pemeriksa keutuhan tautan, dan papan geser di enam tempat. 13 rangkaian uji, 347 pemeriksaan lolos.');
function saveLockLog(){ try{ localStorage.setItem(LOCK_KEY, JSON.stringify(LOCKLOG)); }catch(e){} }
const lockEntries = p => LOCKLOG.filter(x => (x.phase || 1) === (p || 1));
function lockState(p){
  const rows = lockEntries(p || 1);
  const last = rows[rows.length - 1];
  if(!last) return { last:null, locked:true, opens:0, since:0 };
  return { last, locked: last.act !== 'UNLOCK',
    opens: rows.filter(x => x.act === 'UNLOCK').length,
    since: daysBetween(String(last.at).slice(0,10), todayISO()) };
}

/* ================================================================
   PHASE 2.1 — SISTEM TERHUBUNG
   Tautan balik universal · linimasa per record · pemeriksa keutuhan tautan.
   Peta relasinya dibaca langsung dari skema: tiap kolom bertipe rel adalah
   satu sisi hubungan, dan sisi sebaliknya dihitung di sini.
   ================================================================ */

/* ---------------- peta relasi dari skema ---------------- */
const relFields = type => (SCHEMA[type] && SCHEMA[type].f ? SCHEMA[type].f.filter(f => !f.g && f.t === 'rel') : []);

/* Semua record yang menunjuk ke id ini, dikelompokkan per entitas + kolom */
function backlinks(id){
  const groups = [];
  SCH_ORDER.forEach(t => {
    relFields(t).forEach(f => {
      const hits = recs(t).filter(r => r[f.k] === id);
      if(hits.length) groups.push({ type:t, label: SCHEMA[t].n + ' — ' + f.l, field:f.k, items:hits });
    });
  });
  /* tautan yang lahir dari tindakan, bukan dari kolom rel */
  const born = [];
  SCH_ORDER.forEach(t => recs(t).forEach(r => { if(r._m && r._m.source_id === id) born.push(r); }));
  if(born.length) groups.push({ type:null, label:'Dibuat dari record ini', field:'_source', items:born });
  return groups;
}
/* Sisi sebaliknya: record yang ditunjuk OLEH record ini */
function forwardLinks(r){
  if(!r) return [];
  const out = [];
  relFields(typeOf(r)).forEach(f => {
    if(!r[f.k]) return;
    const tgt = recById(r[f.k]);
    out.push({ label:f.l, id:r[f.k], rec:tgt, missing: !tgt, archived: tgt && tgt._m.is_archived });
  });
  if(r._m && r._m.source_id){
    const src = recById(r._m.source_id);
    out.push({ label:'Berasal dari', id:r._m.source_id, rec:src, missing: !src, archived: src && src._m.is_archived });
  }
  return out;
}
const backlinkCount = id => backlinks(id).reduce((s,g) => s + g.items.length, 0);

/* ---------------- blok tautan ---------------- */

  const r = recById(id); if(!r) return '';

      ${fwd.length ? `<span class="pill gray" style="margin-left:6px">${fwd.length} ditunjuk dari sini</span>` : ''}</div></div>

    ${fwd.length ? `<div class="mini" style="font-weight:700;margin:4px 0 6px">DITUNJUK DARI RECORD INI</div>

          <span style="min-width:0;flex:1"><span class="t" style="font-size:13px">${x.rec ? h(SCHEMA[typeOf(x.rec)].t(x.rec)) : 'Record tidak ditemukan'}</span>
            <span class="s">${h(x.id)}${x.missing ? ' · <b style="color:var(--red)">tautan putus</b>' : x.archived ? ' · <b style="color:var(--orange)">sudah diarsipkan</b>' : ''}</span></span>

    ${n ? back.map(g => `

/* ---------------- pemeriksa keutuhan tautan ---------------- */
function linkIssues(){
  const out = [];
  SCH_ORDER.forEach(t => {
    allRecs(t).forEach(r => {
      relFields(t).forEach(f => {
        const v = r[f.k]; if(!v) return;
        const tgt = recById(v);
        if(!tgt) out.push({ r, t, f, v, why:'Record tujuan tidak ditemukan', sev:'red' });
        else if(typeOf(tgt) !== String(f.rel)) out.push({ r, t, f, v, why:'Tipe tidak cocok — seharusnya ' + SCHEMA[f.rel].n, sev:'red' });
        else if(tgt._m.is_archived) out.push({ r, t, f, v, why:'Record tujuan sudah diarsipkan', sev:'orange' });
      });
      if(r._m && r._m.source_id && !recById(r._m.source_id))
        out.push({ r, t, f:{ k:'_source', l:'Berasal dari' }, v:r._m.source_id, why:'Record asal tidak ditemukan', sev:'orange' });
    });
  });
  return out;
}
function clearLink(recId, key){
  const r = recById(recId); if(!r) return;
  const from = key === '_source' ? r._m.source_id : r[key];
  if(key === '_source') r._m.source_id = ''; else r[key] = '';
  r._m.updated_at = new Date().toISOString();
  const f = relFields(typeOf(r)).find(x => x.k === key);
  logAct('UPDATE', r, 'tautan putus dikosongkan', [{ k:key, l:(f ? f.l : 'Berasal dari'), from:from, to:'' }]);
  saveStore(); closeModal(); toast('Tautan dikosongkan — record-nya sendiri tidak disentuh'); go(CUR);
}

/* ================================================================
   PAPAN GESER — drag & drop yang mengubah status
   Ditulis dari nol: tanpa pustaka luar, satu berkas.
   Tiga jalur yang setara, bukan satu jalur dengan tambalan:
     1. Tetikus  — tekan, geser lebih dari 5px, lepas di kolom tujuan.
     2. Sentuh   — tahan 280ms sampai kartu terangkat, baru geser.
     3. Papan ketik / tombol ⇅ — angkat kartu, pilih kolom, lepas.
   Setiap perpindahan tercatat di linimasa record sebagai perubahan
   kolom (dari nilai apa ke nilai apa), dan bisa diurungkan.
   ================================================================ */

const BOARDS = {};
const boardOf = id => BOARDS[id];

/* Kolom dibaca dari skema — bukan ditulis ulang di sini.
   Kalau pilihan status di skema bertambah, kolomnya ikut bertambah. */
function boardCols(b){
  if(b.cols) return b.cols;
  const f = (SCHEMA[b.type].f || []).find(x => x.k === b.key);
  return (f && f.opt) ? f.opt : [];
}
const boardItems = b => (b.items ? b.items() : recs(b.type));
const colColor = (b, c) => (b.colc && b.colc[c]) || 'gray';

/* ---------------- keadaan angkat lewat papan ketik ---------------- */
let KB = null;      /* { bid, id, from, to }  — kartu terangkat, belum dilepas */
let LASTMOVE = null;

/* ---------------- render ---------------- */
function boardCardHTML(b, r, pend){
  const lifted = KB && KB.bid === b.id && KB.id === r.id;
  return `<div class="kan-c${lifted ? ' kan-pend' : ''}" data-id="${r.id}" data-board="${b.id}"
    tabindex="0" role="button"
    aria-label="${h(SCHEMA[typeOf(r)].t(r))} — kolom ${h(r[b.key] || 'tanpa status')}. Tekan Enter untuk mengangkat kartu."
    aria-grabbed="${lifted ? 'true' : 'false'}">
    <button class="kan-mv" title="Pindahkan kartu" aria-label="Pindahkan kartu ini ke kolom lain"
      onclick="event.stopPropagation();boardMenu('${b.id}','${r.id}')">⇅</button>
    ${b.card(r)}
  </div>`;
}

function boardHTML(id){
  const b = BOARDS[id]; if(!b) return '';
  const all = boardItems(b), cols = boardCols(b);
  return `<div class="kan" id="bd-${id}" data-board="${id}">${cols.map(c => {
    let list = all.filter(r => (r[b.key] || '') === c);
    /* kartu yang sedang diangkat ditampilkan di kolom tujuan sementara */
    if(KB && KB.bid === id){
      list = list.filter(r => r.id !== KB.id);
      if(KB.to === c){ const r = recById(KB.id); if(r) list = [r].concat(list); }
    }
    const cc = colColor(b, c);
    return `<div class="kan-col" data-val="${h(c)}" role="group" aria-label="${h(c)}, ${list.length} kartu">
      <div class="kan-hd"><span style="width:8px;height:8px;border-radius:50%;background:${CV(cc)};flex:0 0 8px"></span>
        <b>${h(c)}</b><span class="cnt" style="margin-left:auto">${list.length}</span></div>
      ${list.length ? list.map(r => boardCardHTML(b, r)).join('') : '<div class="kan-e">kosong</div>'}
    </div>`;
  }).join('')}</div>`;
}

/* Kartu papan lengkap dengan kepala dan penjelasan cara memakainya */
function boardCard(id, extraHead){
  const b = BOARDS[id]; if(!b) return '';
  const n = boardItems(b).length;
  if(!n && b.empty) return b.empty();
  return `<div class="card" style="margin-bottom:18px">
    ${cardH(b.ic, b.n, b.c, (extraHead || '') + `<span class="mini" style="margin-left:9px">${n} kartu</span>`)}
    <p class="kan-hint">${ic('arrow')} Geser kartu antar kolom untuk mengubah <b>${h(b.keyLabel || 'status')}</b>.
      Di ponsel: tahan sebentar sampai kartu terangkat. Tanpa tetikus: <kbd>Tab</kbd> ke kartu,
      <kbd>Enter</kbd> mengangkat, <kbd>←</kbd> <kbd>→</kbd> memilih kolom, <kbd>Enter</kbd> melepas, <kbd>Esc</kbd> batal.</p>
    ${boardHTML(id)}

      Yang disimpan dari geseran adalah perpindahan kolomnya, dan itu tercatat di linimasa record.</span></div>
  </div>`;
}

/* ---------------- perpindahan ---------------- */
function boardMove(bid, recId, to, silent){
  const b = BOARDS[bid], r = recById(recId);
  if(!b || !r) return false;
  const from = r[b.key] || '';
  if(from === to) return false;
  const before = Object.assign({}, r, { _priv: r._m.privacy_level });
  r[b.key] = to;
  if(b.onMove) b.onMove(r, to, from);
  r._m.updated_at = new Date().toISOString();
  r._m.updated_by = DB.owner.name;
  logAct('MOVE', r, 'Digeser di ' + b.n, diffRec(before, Object.assign({}, r, { _priv: r._m.privacy_level }), typeOf(r)));
  saveStore();
  LASTMOVE = { bid, id: recId, from, to, at: Date.now() };
  renderBoard(bid);
  if(!silent) boardBar(`${SCHEMA[typeOf(r)].t(r)} → ${to}`);
  return true;
}

function boardUndo(){
  if(!LASTMOVE) return;
  const m = LASTMOVE;
  LASTMOVE = null;
  const b = BOARDS[m.bid], r = recById(m.id);
  if(!b || !r){ boardBarHide(); return; }
  const before = Object.assign({}, r, { _priv: r._m.privacy_level });
  r[b.key] = m.from;
  if(b.onMove) b.onMove(r, m.from, m.to);
  r._m.updated_at = new Date().toISOString();
  logAct('MOVE', r, 'Geseran diurungkan', diffRec(before, Object.assign({}, r, { _priv: r._m.privacy_level }), typeOf(r)));
  saveStore(); renderBoard(m.bid); boardBarHide();
  toast('Geseran diurungkan — kembali ke "' + m.from + '"');
}

function boardLift(bid, recId){
  const b = BOARDS[bid], r = recById(recId); if(!b || !r) return;
  KB = { bid, id: recId, from: r[b.key] || '', to: r[b.key] || '' };
  renderBoard(bid); boardFocus(recId);
  toast('Kartu diangkat — panah kiri/kanan memilih kolom, Enter melepas, Esc batal');
}
function boardKbShift(dir){
  if(!KB) return;
  const b = BOARDS[KB.bid], cols = boardCols(b);
  let i = cols.indexOf(KB.to); if(i < 0) i = 0;
  i = Math.max(0, Math.min(cols.length - 1, i + dir));
  if(cols[i] === KB.to) return;
  KB.to = cols[i];
  renderBoard(KB.bid); boardFocus(KB.id);
}
function boardKbDrop(){
  if(!KB) return;
  const k = KB; KB = null;
  if(k.to !== k.from) boardMove(k.bid, k.id, k.to);
  else renderBoard(k.bid);
  boardFocus(k.id);
}
function boardKbCancel(){
  if(!KB) return;
  const k = KB; KB = null; renderBoard(k.bid); boardFocus(k.id);
  toast('Batal — kartu kembali ke kolom semula');
}
function boardFocus(recId){
  const el = document.querySelector('.kan-c[data-id="' + recId + '"]');
  if(el){ try{ el.focus({ preventScroll:true }); }catch(e){ el.focus(); } }
}

document.addEventListener('keydown', e => {
  const card = e.target && e.target.closest ? e.target.closest('.kan-c[data-id]') : null;
  if(KB){
    if(e.key === 'Escape'){ e.preventDefault(); boardKbCancel(); return; }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); boardKbShift(-1); return; }
    if(e.key === 'ArrowRight'){ e.preventDefault(); boardKbShift(1); return; }
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); boardKbDrop(); return; }
  }
  if(!card) return;
  if(e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    boardLift(card.dataset.board, card.dataset.id);
  }
});

/* ---------------- jalur 1 & 2: geser dengan tetikus / sentuh ---------------- */
let DRAG = null;
const noScroll = e => { if(DRAG && DRAG.started) e.preventDefault(); };

function boardDown(e){
  if(e.button !== undefined && e.button !== 0) return;
  const t = e.target;
  if(!t || !t.closest) return;
  if(t.closest('button') || t.closest('a') || t.closest('input') || t.closest('select')) return;
  const card = t.closest('.kan-c[data-id]'); if(!card) return;
  const board = card.closest('.kan'); if(!board) return;
  if(KB) boardKbCancel();
  DRAG = { card, board, bid: board.dataset.board, id: card.dataset.id,
           x0: e.clientX, y0: e.clientY, started:false, moved:false,
           touch: e.pointerType === 'touch' || e.pointerType === 'pen', hold:null, ghost:null, over:null };
  if(DRAG.touch) DRAG.hold = setTimeout(() => { if(DRAG && !DRAG.moved) boardStart(e.clientX, e.clientY); }, 280);
  document.addEventListener('pointermove', boardMoveEv);
  document.addEventListener('pointerup', boardUp);
  document.addEventListener('pointercancel', boardUp);
  document.addEventListener('touchmove', noScroll, { passive:false });
}

function boardStart(x, y){
  const c = DRAG.card, r = c.getBoundingClientRect();
  DRAG.started = true; DRAG.dx = x - r.left; DRAG.dy = y - r.top;
  const g = c.cloneNode(true);
  const mv = g.querySelector('.kan-mv'); if(mv) mv.remove();
  g.className = 'kan-c kan-ghost';
  g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
  document.body.appendChild(g); DRAG.ghost = g;
  c.classList.add('kan-src'); c.setAttribute('aria-grabbed','true');
  document.body.classList.add('kan-dragging');
  if(navigator.vibrate){ try{ navigator.vibrate(8); }catch(e){} }
}

function boardMoveEv(e){
  if(!DRAG) return;
  const dx = e.clientX - DRAG.x0, dy = e.clientY - DRAG.y0;
  if(Math.abs(dx) > 4 || Math.abs(dy) > 4) DRAG.moved = true;
  if(!DRAG.started){
    if(DRAG.touch){ if(DRAG.moved && DRAG.hold){ clearTimeout(DRAG.hold); DRAG.hold = null; } return; }
    if(Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
    boardStart(e.clientX, e.clientY);
  }
  DRAG.ghost.style.left = (e.clientX - DRAG.dx) + 'px';
  DRAG.ghost.style.top  = (e.clientY - DRAG.dy) + 'px';

  /* kolom di bawah jari / kursor */
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const col = el && el.closest ? el.closest('.kan-col') : null;
  const inBoard = col && col.parentElement === DRAG.board;
  if(DRAG.over && DRAG.over !== col) DRAG.over.classList.remove('kan-over');
  DRAG.over = inBoard ? col : null;
  if(DRAG.over) DRAG.over.classList.add('kan-over');

  /* gulir papan sendiri saat kartu didekatkan ke tepi */
  const br = DRAG.board.getBoundingClientRect();
  if(e.clientX > br.right - 46) DRAG.board.scrollLeft += 14;
  else if(e.clientX < br.left + 46) DRAG.board.scrollLeft -= 14;
}

function boardUp(e){
  if(!DRAG) return;
  const d = DRAG; DRAG = null;
  if(d.hold) clearTimeout(d.hold);
  document.removeEventListener('pointermove', boardMoveEv);
  document.removeEventListener('pointerup', boardUp);
  document.removeEventListener('pointercancel', boardUp);
  document.removeEventListener('touchmove', noScroll);
  document.body.classList.remove('kan-dragging');
  if(d.ghost) d.ghost.remove();
  if(d.over) d.over.classList.remove('kan-over');
  d.card.classList.remove('kan-src'); d.card.setAttribute('aria-grabbed','false');

  if(!d.started){
    /* bukan geseran — ini ketukan biasa, buka recordnya */
    if(!d.moved){ const b = BOARDS[d.bid]; if(b && b.open) b.open(d.id); }
    return;
  }
  if(e && e.type === 'pointercancel') return;
  if(d.over){
    const to = d.over.dataset.val;
    if(!boardMove(d.bid, d.id, to)) renderBoard(d.bid);
  }
}
document.addEventListener('pointerdown', boardDown);

function cloudSavePref(){ try{ localStorage.setItem(CLOUD_PREF, JSON.stringify(CLOUD_PREFS)); }catch(e){} }

/* ---------------- revisi lokal ---------------- */
if(typeof STORE.rev !== 'number')     STORE.rev = 0;
if(typeof STORE.baseRev !== 'number') STORE.baseRev = 0;
const cloudDirty = () => Math.max(0, (STORE.rev || 0) - (STORE.baseRev || 0));

/* Setiap penyimpanan lokal menaikkan revisi — itulah yang dihitung
   sebagai "perubahan belum terkirim". */
let cloudT = null;
const _saveStoreBase = saveStore;
saveStore = function(){
  STORE.rev = (STORE.rev || 0) + 1;
  const okSave = _saveStoreBase.apply(this, arguments);
  cloudChip();
  if(CLOUD_PREFS.auto && CLOUD.avail && !CLOUD.conflict){
    clearTimeout(cloudT);
    cloudT = setTimeout(() => cloudPush(true), CLOUD_DEBOUNCE);
  }
  return okSave;
};

/* ---------------- amplop data ---------------- */
function cloudEnvelope(){
  return {
    v: 1,
    rev: STORE.rev || 0,
    savedAt: new Date().toISOString(),
    savedBy: (typeof DB !== 'undefined' && DB.owner) ? DB.owner.name : 'Aji Jaens',
    counts: SCH_ORDER.reduce((o, t) => { const n = allRecs(t).length; if(n) o[t] = n; return o; }, {}),
    seq: STORE.seq || {},
    rec: STORE.rec || {},
    log: STORE.log || [],
    lock: (typeof LOCKLOG !== 'undefined') ? LOCKLOG : []
  };
}
const envCount = e => Object.keys((e && e.rec) || {}).reduce((s, t) => s + e.rec[t].length, 0);

/* Menyalin keadaan sekarang sebelum ditimpa — selalu, tanpa kecuali. */
function cloudKeepPrev(why){
  try{ localStorage.setItem(CLOUD_PREV, JSON.stringify({ why, at:new Date().toISOString(), data: cloudEnvelope() })); }catch(e){}
}
function cloudAdopt(env, why){
  cloudKeepPrev(why || 'sebelum mengambil versi awan');
  STORE.seq = env.seq || {};
  STORE.rec = env.rec || {};
  STORE.log = env.log || [];
  STORE.rev = env.rev || 0;
  STORE.baseRev = env.rev || 0;
  if(typeof LOCKLOG !== 'undefined' && Array.isArray(env.lock) && env.lock.length){
    LOCKLOG = env.lock; if(typeof saveLockLog === 'function') saveLockLog();
  }
  _saveStoreBase();
  CLOUD.remote = env; CLOUD.conflict = null;
  cloudChip();
}

/* ---------------- jembatan ke penyimpanan halaman ---------------- */
let _artifactNs;
async function cloudNs(){
  if(_artifactNs !== undefined) return _artifactNs;
  _artifactNs = null;
  try{
    if(typeof window !== 'undefined' && window.claude && window.claude.use)
      _artifactNs = await window.claude.use('artifact');
  }catch(e){ _artifactNs = null; }
  return _artifactNs;
}

/* Membaca berkas data milik halaman ini. Berkas belum ada = wajar,
   bukan kesalahan: itu keadaan sebelum penyimpanan pertama. */
async function cloudFetch(){
  try{
    const r = await fetch(CLOUD_FILE, { cache:'no-store' });
    if(!r.ok) return null;
    const t = await r.text();
    if(!t || !t.trim()) return null;
    const o = JSON.parse(t);
    return (o && o.rec) ? o : null;
  }catch(e){ return null; }
}

async function cloudBoot(){
  const ns = await cloudNs();
  CLOUD.avail = !!(ns && ns.publish);
  CLOUD.ready = true;
  if(!CLOUD.avail){ cloudChip(); return; }
  const env = await cloudFetch();
  CLOUD.remote = env;
  if(env){
    const dirty = cloudDirty();
    if(env.rev > (STORE.baseRev || 0) && dirty > 0){
      /* Dua versi berbeda. Tidak dipilih diam-diam. */
      CLOUD.conflict = { remote: env, localDirty: dirty };
      cloudConflictBar();
    } else if(env.rev > (STORE.baseRev || 0)){
      cloudAdopt(env, 'mengambil versi awan yang lebih baru saat halaman dibuka');
      toast('Data terbaru diambil dari awan — ' + envCount(env) + ' record');
      if(typeof go === 'function' && typeof CUR !== 'undefined') go(CUR);
    }
  }
  cloudChip();
}

/* ---------------- menyimpan ke awan ---------------- */
async function cloudPush(silent){
  if(CLOUD.busy) return false;
  if(CLOUD.conflict){ if(!silent) toast('Selesaikan dulu perbedaan versi di bawah'); return false; }
  const ns = await cloudNs();
  if(!ns || !ns.publish){ CLOUD.avail = false; cloudChip(); if(!silent) cloudUnavailable(); return false; }
  CLOUD.busy = true; cloudChip();
  const env = cloudEnvelope();
  try{
    const files = {}; files[CLOUD_FILE] = JSON.stringify(env);
    await ns.publish(files);
    STORE.baseRev = env.rev;
    _saveStoreBase();
    CLOUD.lastPush = env.savedAt; CLOUD.lastErr = null; CLOUD.remote = env; CLOUD.avail = true;
    if(!silent) toast('Tersimpan ke awan — ' + envCount(env) + ' record, revisi ' + env.rev);
  }catch(err){
    const code = (err && err.code) || 'upstream_error';
    CLOUD.lastErr = { code, at:new Date().toISOString() };
    if(code === 'not_writer' || code === 'not_granted' || code === 'not_declared' ||
       code === 'capability_disabled' || code === 'capability_removed'){
      CLOUD.readOnly = true; CLOUD.avail = false;
    }
    if(code === 'conflict'){
      /* Ada yang menyimpan lebih dulu. Perangkat lain akan memuat ulang
         ke versi pemenang; yang di sini tetap disimpan lokal. */
      if(!silent) toast('Perangkat lain menyimpan lebih dulu — perubahan Anda tetap aman di perangkat ini');
    } else if(!silent){
      toast(CLOUD_ERR[code] || ('Gagal menyimpan ke awan (' + code + ') — data tetap aman di perangkat ini'));
    }
  }
  CLOUD.busy = false; cloudChip();
  return !CLOUD.lastErr;
}
const CLOUD_ERR = {
  not_writer:'Tampilan ini hanya bisa membaca — penyimpanan ke awan dimatikan',
  not_granted:'Halaman ini tidak diberi izin menyimpan ke awan',
  not_declared:'Versi halaman ini tidak lagi menyatakan kemampuan menyimpan',
  too_large:'Data sudah terlalu besar untuk satu berkas — arsipkan record lama lalu coba lagi',
  rate_limited:'Terlalu sering menyimpan — tunggu sebentar, perubahan tetap aman di perangkat ini',
  capability_disabled:'Penyimpanan ke awan tidak tersedia di tampilan ini'
};

       (misalnya berkas yang diunduh, atau dibuka dari Google Drive). Berkas seperti itu tidak punya tempat

     <div class="rows">
       <div class="row-i" style="cursor:default"><span class="pill green">TETAP BISA</span>
         <span style="min-width:0;flex:1"><span class="t" style="font-size:13px">Semua entri, papan, dan laporan</span>
           <span class="s">Tidak ada fitur yang mati — hanya sinkronisasinya yang tidak jalan.</span></span></div>
       <div class="row-i" style="cursor:default"><span class="pill green">TETAP BISA</span>
         <span style="min-width:0;flex:1"><span class="t" style="font-size:13px">Ekspor CSV per entitas</span>
           <span class="s">Buka System Foundation › Data Saya untuk mengunduh isinya.</span></span></div>
       <div class="row-i" style="cursor:default"><span class="pill orange">PERLU TAUTAN OS</span>
         <span style="min-width:0;flex:1"><span class="t" style="font-size:13px">Sinkron antar perangkat dan cadangan Drive</span>
           <span class="s">Buka OS lewat tautannya, bukan lewat berkas unduhan, lalu keduanya menyala sendiri.</span></span></div>

/* ---------------- perbedaan versi: diputuskan Anda ---------------- */
function cloudConflictBar(){
  let el = document.getElementById('cloudBar');
  if(!el){
    el = document.createElement('div');
    el.id = 'cloudBar'; el.className = 'kan-bar'; el.setAttribute('role','alert');
    document.body.appendChild(el);
  }
  const c = CLOUD.conflict; if(!c){ el.classList.remove('on'); return; }
  el.innerHTML = `<span><b>Dua versi berbeda.</b> Awan revisi ${c.remote.rev} · perangkat ini ${c.localDirty} perubahan belum terkirim.</span>
    <button class="btn solid sm" onclick="cloudResolve()">Lihat bedanya</button>`;
  el.classList.add('on');
}
function cloudResolve(){
  const c = CLOUD.conflict; if(!c) return;
  const r = c.remote, localN = SCH_ORDER.reduce((s,t) => s + allRecs(t).length, 0);
  const row = (lbl, a, b) => `<tr><td class="mini">${h(lbl)}</td><td><b>${h(String(a))}</b></td><td><b>${h(String(b))}</b></td></tr>`;
  modal('Dua versi berbeda', 'Tidak ada yang saya pilih sendiri — keduanya data Anda.',
    `<p class="sub" style="margin:0 0 14px">Versi di awan disimpan dari perangkat lain, sementara di perangkat ini ada
       ${c.localDirty} perubahan yang belum terkirim. Menggabungkan keduanya baris per baris bisa membuat record ganda,
       jadi saya tidak melakukannya diam-diam.</p>
     <div style="overflow-x:auto;margin-bottom:14px"><table class="tbl"><thead><tr>
       <th></th><th>Versi awan</th><th>Perangkat ini</th></tr></thead><tbody>
       ${row('Revisi', r.rev, STORE.rev || 0)}
       ${row('Jumlah record', envCount(r), localN)}
       ${row('Disimpan', r.savedAt ? dtID(r.savedAt) : '—', CLOUD.lastPush ? dtID(CLOUD.lastPush) : 'belum pernah')}
       ${row('Oleh', r.savedBy || '—', (DB.owner && DB.owner.name) || '—')}
     </tbody></table></div>
     <div class="statebar" style="margin:0 0 14px">
       <span class="dbadge" style="background:var(--green)">SEBELUM APA PUN</span>
       <div style="flex:1;min-width:220px">Apa pun yang Anda pilih, keadaan sekarang disalin dulu ke penyimpanan cadangan
         di peramban ini, jadi tidak ada yang benar-benar hilang.</div>
     </div>
     <div class="rows">
       <div class="row-i" onclick="cloudTakeRemote()"><span class="pill blue">AMBIL AWAN</span>
         <span style="min-width:0;flex:1"><span class="t" style="font-size:13px">Pakai versi awan</span>
           <span class="s">${c.localDirty} perubahan di perangkat ini ditinggalkan (tersalin ke cadangan).</span></span>
         <span class="rt mini">→</span></div>
       <div class="row-i" onclick="cloudKeepLocal()"><span class="pill orange">KIRIM PERANGKAT INI</span>
         <span style="min-width:0;flex:1"><span class="t" style="font-size:13px">Pakai versi perangkat ini</span>
           <span class="s">Versi awan akan digantikan oleh yang ada di sini.</span></span>
         <span class="rt mini">→</span></div>
       <div class="row-i" onclick="closeModal()"><span class="pill gray">NANTI</span>
         <span style="min-width:0;flex:1"><span class="t" style="font-size:13px">Belum memutuskan</span>
           <span class="s">Sinkronisasi otomatis berhenti sampai ini diputuskan. Tidak ada data yang berubah.</span></span>
         <span class="rt mini">→</span></div>
     </div>`,
    `<button class="btn ghost" onclick="closeModal()">Tutup</button>`, true);
}
function cloudTakeRemote(){
  const c = CLOUD.conflict; if(!c) return;
  cloudAdopt(c.remote, 'mengambil versi awan saat dua versi berbeda');
  closeModal(); cloudConflictBar();
  toast('Versi awan dipakai — keadaan sebelumnya tersalin ke cadangan peramban');
  if(typeof go === 'function' && typeof CUR !== 'undefined') go(CUR);
}
function cloudKeepLocal(){
  if(!CLOUD.conflict) return;
  cloudKeepPrev('sebelum menimpa versi awan dengan versi perangkat ini');
  STORE.baseRev = CLOUD.conflict.remote.rev;   /* supaya push berikutnya menang */
  STORE.rev = Math.max(STORE.rev || 0, CLOUD.conflict.remote.rev) + 1;
  CLOUD.conflict = null;
  _saveStoreBase(); closeModal(); cloudConflictBar();
  cloudPush();
}

/* ---------------- cadangan ke Google Drive ---------------- */
let _mcpNs;
async function driveNs(){
  if(_mcpNs !== undefined) return _mcpNs;
  _mcpNs = null;
  try{
    if(typeof window !== 'undefined' && window.claude && window.claude.use)
      _mcpNs = await window.claude.use('mcp');
  }catch(e){ _mcpNs = null; }
  CLOUD.drive.avail = !!(_mcpNs && _mcpNs.callTool);
  return _mcpNs;
}
async function driveBackup(){
  if(CLOUD.drive.busy) return false;
  const ns = await driveNs();
  if(!ns || !ns.callTool){
    CLOUD.drive.avail = false; cloudChip();
    toast('Cadangan Drive hanya jalan saat OS dibuka lewat tautannya');
    return false;
  }
  CLOUD.drive.busy = true; cloudChip();
  const env = cloudEnvelope();
  const stamp = env.savedAt.slice(0,19).replace(/[:T]/g,'-');
  try{
    const res = await ns.callTool('Google Drive', 'create_file', {
      title: 'ajios-cadangan-' + stamp + '.json',
      parentId: CLOUD_DRIVE_FOLDER,
      contentMimeType: 'application/json',
      disableConversionToGoogleType: true,
      textContent: JSON.stringify(env)
    });
    const p = (res && res.payload) || {};
    CLOUD.drive.lastAt = env.savedAt;
    CLOUD.drive.lastUrl = p.viewUrl || '';
    CLOUD.drive.lastErr = null;
    toast('Cadangan tersimpan di Drive — folder 96 — LIVE DATA');
  }catch(err){
    CLOUD.drive.lastErr = (err && err.code) || 'upstream_error';
    toast('Cadangan Drive gagal (' + CLOUD.drive.lastErr + ') — data tetap aman di perangkat ini');
  }
  CLOUD.drive.busy = false; cloudChip();
  return !CLOUD.drive.lastErr;
}

/* Unduhan berkas cadangan.
   Di dalam penampil, berkas diserahkan lewat jalur unduhan resmi —
   tautan biasa tidak berfungsi di sana, dan halaman yang menawarkan
   tombol mati lebih buruk daripada tidak menawarkannya sama sekali.
   Di salinan berkas biasa, tautan biasa yang dipakai. */
let _dlNs;
async function dlNs(){
  if(_dlNs !== undefined) return _dlNs;
  _dlNs = null;
  try{
    if(typeof window !== 'undefined' && window.claude && window.claude.use)
      _dlNs = await window.claude.use('downloads');
  }catch(e){ _dlNs = null; }
  return _dlNs;
}
async function cloudDownload(){
  const env = cloudEnvelope();
  const name = 'ajios-cadangan-' + env.savedAt.slice(0,19).replace(/[:T]/g,'-') + '.json';
  const body = JSON.stringify(env, null, 1);
  const ns = await dlNs();
  if(ns && ns.save){
    try{
      await ns.save({ filename:name, data:body });
      toast('Berkas cadangan disimpan — ' + envCount(env) + ' record');
    }catch(err){
      const code = (err && err.code) || 'upstream_error';
      if(code === 'user_cancelled' || code === 'cancelled') toast('Unduhan dibatalkan');
      else toast('Unduhan gagal (' + code + ') — coba Cadangkan ke Drive');
    }
    return;
  }
  const blob = new Blob([body], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  toast('Berkas cadangan diunduh — ' + envCount(env) + ' record');
}

/* ---------------- penanda keadaan di sudut layar ---------------- */
function cloudChip(){
  let el = document.getElementById('cloudChip');
  if(!el){
    el = document.createElement('button');
    el.id = 'cloudChip'; el.className = 'cloudchip';
    el.setAttribute('aria-live','polite');
    el.onclick = () => { fTab = 'cloud'; go('foundation'); };
    document.body.appendChild(el);
  }
  const d = cloudDirty();
  let cls = 'ok', txt = 'Tersinkron', ico = 'check';
  if(!CLOUD.ready)          { cls = 'idle'; txt = 'Memeriksa…'; ico = 'clock'; }
  else if(CLOUD.conflict)   { cls = 'warn'; txt = 'Dua versi berbeda'; ico = 'flag'; }
  else if(CLOUD.busy)       { cls = 'idle'; txt = 'Menyimpan…'; ico = 'clock'; }
  else if(!CLOUD.avail)     { cls = 'idle'; txt = 'Hanya di perangkat ini'; ico = 'shield'; }
  else if(d)                { cls = 'warn'; txt = d + ' belum terkirim'; ico = 'arrow'; }
  el.className = 'cloudchip ' + cls;
  el.innerHTML = `<span class="ci">${ic(ico)}</span><span>${h(txt)}</span>`;
  el.title = txt + (CLOUD.lastPush ? ' · terakhir tersimpan ' + dtID(CLOUD.lastPush) : '');
}

/* ---------------- 2. HUBUNGAN TAMBAHAN (banyak-ke-banyak) ----------------
   Kolom rel sudah memberi satu-ke-banyak dua arah lewat p22_links.
   _m.links menampung sumber tambahan supaya satu bahan bisa menunjuk
   lebih dari satu pembelajaran atau praktik. */

function npLinks(r){ return (r && r._m && Array.isArray(r._m.links)) ? r._m.links : []; }
function npAddLink(recId, otherId){
  const r = recById(recId), o = recById(otherId);
  if(!r || !o || recId === otherId) return false;
  r._m.links = npLinks(r).slice();
  if(r._m.links.indexOf(otherId) === -1){ r._m.links.push(otherId); saveStore(); return true; }
  return false;
}
function npDropLink(recId, otherId){
  const r = recById(recId); if(!r) return;
  r._m.links = npLinks(r).filter(x => x !== otherId); saveStore(); go(CUR);
}

/* p22 membaca kolom rel dan source_id. Dibungkus supaya _m.links ikut terbaca
   dari kedua arah — bukan menggantikan, hanya menambah. */
const _npBack = backlinks, _npFwd = forwardLinks;
backlinks = function(id){
  const g = _npBack(id);
  const extra = [];
  SCH_ORDER.forEach(t => recs(t).forEach(r => { if(npLinks(r).indexOf(id) !== -1) extra.push(r); }));
  if(extra.length) g.push({ type:null, label:'Ditautkan ke record ini', field:'_links', items:extra });
  return g;
};
forwardLinks = function(r){
  const out = _npFwd(r);
  npLinks(r).forEach(id => {
    const t = recById(id);
    out.push({ label:'Tautan tambahan', id, rec:t, missing:!t, archived: t && t._m.is_archived });
  });
  return out;
};

/* ---------------- 3. CAP SUMBER ("Sumber diperbarui — tinjau kembali") ---- */

function npStamp(r){
  if(!r) return '';
  return [r.n, r.note, r.summary, r.lesson, r.apply, r.res, r.refl, r.next]
    .map(x => x || '').join('\u0001');
}
function npSrcIds(r){
  return [r.learn, r.prak, (r._m && r._m.source_id) || ''].concat(npLinks(r)).filter(Boolean);
}
/* true bila salah satu sumbernya berubah sejak bahan ini terakhir ditinjau */
function npSrcChanged(r){
  const snap = (r._m && r._m.src_snap) || null;
  if(!snap) return false;
  return npSrcIds(r).some(id => {
    const s = recById(id);
    return s && snap[id] !== undefined && snap[id] !== npStamp(s);
  });
}
function npTakeSnap(r){
  const snap = {};
  npSrcIds(r).forEach(id => { const s = recById(id); if(s) snap[id] = npStamp(s); });
  r._m.src_snap = snap;
}
function npReviewed(id){
  const r = recById(id); if(!r) return;
  npTakeSnap(r); r._m.updated_at = new Date().toISOString();
  logAct('UPDATE', r, 'Sumber ditinjau kembali');
  saveStore(); toast('Ditandai sudah ditinjau terhadap sumbernya'); go(CUR);
}

/* Dari Learn ATAU Do. Tidak menyalin lampiran, catatan internal, atau kontak. */
function npMakeMaterial(srcId){
  const s = recById(srcId); if(!s) return;
  const T = typeOf(s);
  const priv = s._m.privacy_level;
  const bits = [
    ['Ringkasan', s.summary], ['Pelajaran', s.lesson], ['Rencana penerapan', s.apply],
    ['Situasi', s.sit], ['Tindakan', s.act], ['Hasil yang tercatat', s.res],
    ['Refleksi', s.refl], ['Langkah berikutnya', s.next]
  ].filter(x => x[1]);
  modal('Jadikan bahan mengajar',
    'Sumber: ' + s.id + ' · tingkat privasi <b>' + h(priv) + '</b>. Pilih sendiri bagian yang boleh menjadi bahan. Tidak ada yang ikut otomatis.',
    `<div class="frm">
      ${bits.length ? bits.map((b,i) => `<label class="fld full" style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">
         <input type="checkbox" class="npPick" data-lab="${h(b[0])}" data-val="${h(b[1])}" ${i===0?'checked':''} style="margin-top:4px">
         <span><b>${h(b[0])}</b><br><span class="mini">${h(String(b[1]).slice(0,180))}${String(b[1]).length>180?'…':''}</span></span></label>`).join('')
       : `<p class="mini">Sumber ini belum punya isi yang bisa dipilih. Bahan akan dibuat kosong dan Anda isi sendiri.</p>`}
      <div class="fld full"><span class="mini">Lampiran, catatan internal, dan kontak tidak pernah ikut disalin. Bahan disimpan sebagai <b>Draft</b> dengan izin berbagi <b>Belum diputuskan</b>.</span></div>
    </div>`,
    `<button class="btn solid" onclick="npBuildMaterial('${srcId}')">${ic('check')} Buat draft bahan</button>
     <button class="btn ghost" onclick="closeModal()">Batal</button>`, true);
}
function npBuildMaterial(srcId){
  const s = recById(srcId); if(!s) return;
  const T = typeOf(s);
  const picked = [];
  document.querySelectorAll('.npPick').forEach(el => {
    if(el.checked) picked.push(el.dataset.lab + ':\n' + el.dataset.val);
  });
  closeModal();
  openForm('BHN', null, {
    n: s.n || '',
    msg: '',
    learn: T === 'LRN' ? srcId : (s.learn || ''),
    prak:  T === 'PRK' ? srcId : '',
    topic: s.topic || '',
    picked: picked.join('\n\n'),
    st: 'Draft',
    perm: 'Belum diputuskan'
  }, srcId);
}

/* ---------------- 5. SARAN LANGKAH BERIKUTNYA (berbasis aturan) ----------
   Aturan sederhana yang bisa dijelaskan. BUKAN keluaran model AI. */

function npSuggest(){
  const out = [];
  recs('LRN').forEach(r => {
    if(r.lesson && !r.apply)
      out.push({ id:r.id, t:r.n, w:'Sudah punya pelajaran utama, belum punya rencana penerapan.',
                 a:`openForm('LRN','${r.id}')`, al:'Isi rencana penerapan', c:'green' });
    else if(r.apply && !recs('PRK').some(p => p.learn === r.id || p._m.source_id === r.id))
      out.push({ id:r.id, t:r.n, w:'Rencana penerapan sudah ada, tetapi belum ada praktik yang mencatatnya.',
                 a:`npMakePractice('${r.id}')`, al:'Jadikan praktik', c:'blue' });
    else if(!r.lesson && (r.summary || r.note))
      out.push({ id:r.id, t:r.n, w:'Catatan sudah ada, pelajaran utamanya belum ditulis.',
                 a:`openForm('LRN','${r.id}')`, al:'Tulis pelajaran', c:'green' });
  });
  recs('PRK').forEach(r => {
    if(r.st === 'Dilakukan' && !r.res)
      out.push({ id:r.id, t:r.n, w:'Ditandai sudah dilakukan, hasilnya belum dicatat.',
                 a:`openForm('PRK','${r.id}')`, al:'Catat hasil', c:'blue' });
    else if(r.res && !r.refl)
      out.push({ id:r.id, t:r.n, w:'Hasil sudah tercatat, refleksinya belum ditulis.',
                 a:`openForm('PRK','${r.id}')`, al:'Tulis refleksi', c:'blue' });
    else if(r.refl && !recs('BHN').some(b => b.prak === r.id || b._m.source_id === r.id))
      out.push({ id:r.id, t:r.n, w:'Sudah direfleksikan dan belum pernah dijadikan bahan mengajar.',
                 a:`npMakeMaterial('${r.id}')`, al:'Jadikan bahan', c:'orange' });
  });
  recs('BHN').forEach(r => {
    if(npSrcChanged(r))
      out.push({ id:r.id, t:r.n, w:'Sumbernya berubah sejak bahan ini terakhir ditinjau.',
                 a:`recDetail('${r.id}')`, al:'Tinjau kembali', c:'red' });
    else if(r.st === 'Disetujui' && r.perm === 'Belum diputuskan')
      out.push({ id:r.id, t:r.n, w:'Isinya sudah disetujui, izin berbagi belum diputuskan.',
                 a:`openForm('BHN','${r.id}')`, al:'Putuskan izin', c:'orange' });
  });
  return out;
}

const npHas = (r, keys) => keys.some(k => r[k]);
function npMatch(r, q){
  if(!q) return true;
  const s = JSON.stringify(Object.keys(r).filter(k=>k!=='_m').map(k=>r[k])).toLowerCase();
  return s.indexOf(q.toLowerCase()) !== -1;
}

/* --- daftar generik --- */
function knList(T, key, intro, emptyBody){
  const S = SCHEMA[T];
  const q = KNQ[key];
  const all = recs(T);
  const rows = all.filter(r => npMatch(r, q));
  const search = `<div class="card" style="margin-bottom:16px">
    <div class="flexr" style="gap:8px;flex-wrap:wrap">
      <input type="text" value="${h(q)}" placeholder="Cari di ${h(S.n)}…"
        oninput="KNQ['${key}']=this.value" onchange="knQ('${key}',this.value)"
        onkeydown="if(event.key==='Enter'){event.preventDefault();knQ('${key}',this.value)}"
        style="flex:1;min-width:170px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit;font-size:13.5px;outline:0">
      <button class="btn solid sm" onclick="openForm('${T}')">${ic('plus')} Tambah</button>
      ${q ? `<button class="btn ghost sm" onclick="knQ('${key}','')">Bersihkan</button>` : ''}
    </div>
    <div class="mini" style="margin-top:8px">${intro}</div></div>`;

  if(!all.length) return search + emptyCard(S.ic, S.c, S.n + ' masih kosong', emptyBody,
    `<button class="btn solid" onclick="openForm('${T}')">${ic('plus')} ${h(S.n)} pertama</button>`);
  if(!rows.length) return search + `<div class="card"><div class="mini">Tidak ada yang cocok dengan "${h(q)}". ${all.length} record lain tetap ada.</div></div>`;

  return search + `<div class="card"><div class="list">${rows.map(r => {
    const warn = T === 'BHN' && npSrcChanged(r);
    return `<button class="row-i" style="width:100%;text-align:left" onclick="recDetail('${r.id}')">
      ${ic(S.ic)}<span style="flex:1"><span class="t">${h(S.t(r) || r.id)}</span>
      <span class="s">${h(S.s(r) || '')} · ${r.id}</span></span>
      ${warn ? `<span class="pill red">SUMBER BERUBAH</span>` : ''}
      ${r.st ? `<span class="pill ${S.c}">${h(r.st)}</span>` : ''}</button>`;
  }).join('')}</div></div>`;
}
