function npPromote(id){
  const s = recById(id); if(!s) return;
  const dup = recs('LRN').find(l => l._m.source_id === id);
  if(dup){ toast('Sudah pernah disalin — ' + dup.id); recDetail(dup.id); return; }
  openForm('LRN', null, {
    n: s.n || '', note: s.summary || s.lesson || '', summary: s.summary || '',
    lesson: s.lesson || '', apply: s.apply || '', src: s.src || '', url: s.url || '',
    topic: s.tags || '', jenis: 'Lainnya', st: s.lesson ? 'Sudah Direfleksikan' : 'Draft'
  }, id);
}

function npDetailExtra(r){
  const T = typeOf(r); if(['LRN','PRK','BHN'].indexOf(T) === -1) return '';
  let out = '';

  if(T === 'BHN'){
    if(npSrcChanged(r)) out += `<div class="statebar del" style="margin-bottom:14px">
      <span class="dbadge" style="background:var(--red)">TINJAU</span>
      <div style="flex:1;min-width:200px"><b>Sumber diperbarui.</b> Salah satu sumber bahan ini berubah sejak terakhir ditinjau.

      <button class="btn ghost sm" onclick="npReviewed('${r.id}')">Sudah saya tinjau</button></div>`;
    if(r.st === 'Disetujui' && r.perm !== 'Boleh dibagikan') out += `<div class="statebar" style="margin-bottom:14px">
      <span class="dbadge" style="background:var(--orange)">IZIN</span>
      <div style="flex:1;min-width:200px">Isinya sudah disetujui, tetapi izin berbagi masih
      <b>${h(r.perm || 'Belum diputuskan')}</b>. Peninjauan isi dan izin berbagi memang dipisah.</div></div>`;
  }

  /* praktik: kalau hasil/refleksi sudah ada, itu yang ditonjolkan — bukan bukti */
  if(T === 'PRK' && (r.res || r.refl)) out += `<div class="card" style="margin-bottom:14px;border-color:var(--blue)">
    ${cardH('bolt','Hasil & refleksi','blue')}
    ${r.res  ? `<div style="margin-bottom:8px"><span class="mini">Hasil yang tercatat</span><div>${h(r.res).replace(/\n/g,'<br>')}</div></div>` : ''}
    ${r.refl ? `<div><span class="mini">Refleksi</span><div>${h(r.refl).replace(/\n/g,'<br>')}</div></div>` : ''}
    ${!r.refl ? `<div class="mini">Hasil sudah ada, refleksi belum ditulis.</div>` : ''}</div>`;

  const extra = npLinks(r);
  if(extra.length) out += `<div class="card" style="margin-bottom:14px">
    ${cardH('net','Tautan tambahan','teal',`<span class="mini">${extra.length}</span>`)}
    <div class="list">${extra.map(id => { const o = recById(id);
      return `<div class="row-i"><span style="flex:1"><span class="t">${o ? h(SCHEMA[typeOf(o)].t(o)) : id}</span>
        <span class="s">${id}${o && o._m.is_archived ? ' · diarsipkan' : (o ? '' : ' · tidak ditemukan')}</span></span>
        <button class="btn ghost sm" onclick="npDropLink('${r.id}','${id}')">Lepas</button></div>`;
    }).join('')}</div></div>`;

  return out;
}

/* ---------------- 3. VERSI MODUL ----------------
   Versi naik hanya kalau ISI berubah, bukan tiap kali disimpan.
   Program yang sudah disematkan menyimpan versi + salinannya, sehingga
   revisi modul berikutnya tidak mengubah program yang sudah dipakai. */

function modStamp(m){
  return ['n','aud','dur','obj','msg','topics','story','ex','outcome','refl']
    .map(k => m[k] || '').join('\u0001');
}
function modVer(m){
  if(!m || !m._m) return 1;
  const s = modStamp(m);
  if(m._m.mstamp === undefined){ m._m.mstamp = s; m._m.ver = m._m.ver || 1; saveStore(); }
  else if(m._m.mstamp !== s){ m._m.mstamp = s; m._m.ver = (m._m.ver || 1) + 1; saveStore(); }
  return m._m.ver;
}

/* ---------------- 4. SUSUNAN PROGRAM & RUNDOWN ----------------
   _m.plan = daftar item berurutan. Durasi dihitung SEKALI per item:
   item modul memakai durasi modulnya, item lain memakai durasinya sendiri. */

const OTH_KIND = ['MC','Video','Aji masuk','Aktivitas','Jeda','Tanya jawab','Penutup','Lainnya'];
const plan = p => (p && p._m && Array.isArray(p._m.plan)) ? p._m.plan : [];
function planSet(p, items){ p._m.plan = items; p._m.updated_at = new Date().toISOString(); saveStore(); }

function itemDur(it){
  if(it.k === 'mod'){
    if(it.ver && it.snap) return Number(it.snap.dur) || 0;      /* sudah disematkan */
    const m = recById(it.id); return m ? (Number(m.dur) || 0) : 0;
  }
  return Number(it.dur) || 0;
}
function itemName(it){
  if(it.k === 'mod'){
    if(it.ver && it.snap) return it.snap.n;
    const m = recById(it.id); return m ? m.n : '(modul tidak ditemukan)';
  }
  return it.n || it.t;
}
const planTotal = p => plan(p).reduce((s,it) => s + itemDur(it), 0);
function planDelta(p){
  const t = Number(p.target) || 0;
  return t ? planTotal(p) - t : null;
}
/* modul yang dipakai program ini, tanpa duplikat hitungan */
const planMods = p => plan(p).filter(x => x.k === 'mod');

function prgAddMod(pid, mid){
  const p = recById(pid), m = recById(mid); if(!p || !m) return;

}

  const d = Number(document.getElementById('ohD').value) || 0;
  const n = (document.getElementById('ohN').value || '').trim() || t;
  planSet(p, plan(p).concat([{ k:'oth', t, n, dur:d }]));
  closeModal(); go('knowledge');
}
/* Melepas hanya memutus hubungan. Modulnya tetap ada. */
function prgDrop(pid, i){
  const p = recById(pid); if(!p) return;
  const it = plan(p)[i]; if(!it) return;
  if(it.k === 'mod'){
    modal('Lepas modul dari program?',
      'Yang dihapus hanya hubungannya dengan program ini. <b>Modulnya sendiri tetap ada</b> di daftar Modul dan tetap bisa dipakai program lain.',
      `<div class="mini">Modul: <b>${h(itemName(it))}</b></div>`,
      `<button class="btn red" onclick="prgDropGo('${pid}',${i})">Lepas dari program</button>
       <button class="btn ghost" onclick="closeModal()">Batal</button>`);
    return;
  }
  prgDropGo(pid, i);
}
function prgDropGo(pid, i){
  const p = recById(pid); if(!p) return;
  const items = plan(p).slice(); const [it] = items.splice(i,1);
  planSet(p, items); logAct('UPDATE', p, 'Dilepas dari susunan: ' + itemName(it));
  closeModal(); go('knowledge');
}
function prgMove(pid, i, d){
  const p = recById(pid); if(!p) return;
  const items = plan(p).slice(), j = i + d;
  if(j < 0 || j >= items.length) return;
  const t = items[i]; items[i] = items[j]; items[j] = t;
  planSet(p, items); go('knowledge');
}

/* Sematkan versi modul saat program dipakai */
function prgPin(pid){
  const p = recById(pid); if(!p) return;
  const items = plan(p).map(it => {
    if(it.k !== 'mod') return it;
    const m = recById(it.id); if(!m) return it;
    return { k:'mod', id:it.id, ver:modVer(m), snap:{ n:m.n, dur:Number(m.dur)||0 } };
  });
  planSet(p, items);
  logAct('UPDATE', p, 'Versi modul disematkan');
  toast('Versi modul disematkan — revisi berikutnya tidak mengubah program ini');
  go('knowledge');
}
function prgUnpin(pid){
  const p = recById(pid); if(!p) return;
  planSet(p, plan(p).map(it => it.k === 'mod' ? { k:'mod', id:it.id } : it));
  logAct('UPDATE', p, 'Sematan versi dilepas');
  go('knowledge');
}
/* modul yang sudah berubah sejak disematkan */
function prgStale(p){
  return planMods(p).filter(it => {
    if(!it.ver) return false;
    const m = recById(it.id);
    return m && modVer(m) !== it.ver;
  });
}

/* ---------------- 5. KESIAPAN ----------------
   Setiap kekurangan bisa dibuka untuk diperbaiki. */

function modChecks(m){
  const srcs = npLinks(m).map(recById).filter(x => x && typeOf(x) === 'BHN');
  const noPerm = srcs.filter(b => b.perm !== 'Boleh dibagikan');
  return [
    { ok: !!m.obj,      t:'Tujuan belajar terisi',            a:`openForm('MOD','${m.id}')` },
    { ok: !!m.aud,      t:'Audiens ditentukan',               a:`openForm('MOD','${m.id}')` },
    { ok: !!(m.topics || m.story), t:'Isi atau cerita terisi', a:`openForm('MOD','${m.id}')` },
    { ok: !!Number(m.dur), t:'Durasi ditentukan',             a:`openForm('MOD','${m.id}')` },
    { ok: !!m.outcome,  t:'Hasil peserta terisi',             a:`openForm('MOD','${m.id}')` },
    { ok: noPerm.length === 0,
      t: srcs.length ? 'Izin seluruh bahan sumber sudah diputuskan' : 'Belum ada bahan sumber yang ditautkan',
      sub: noPerm.length ? noPerm.length + ' bahan belum berizin bagikan' : (srcs.length ? '' : 'Boleh saja, tapi modul tanpa sumber tidak punya jejak asal'),
      a:`shTab('bank')`, soft: !srcs.length }
  ];
}
function prgChecks(p){
  const mods = planMods(p).map(it => recById(it.id)).filter(Boolean);
  const notReady = mods.filter(m => m.st !== 'Siap Digunakan');
  const d = planDelta(p);
  const stale = prgStale(p);
  return [
    { ok: !!p.aud,     t:'Audiens ditentukan',      a:`openForm('PRG','${p.id}')` },
    { ok: !!p.goal,    t:'Tujuan belajar tersedia', a:`openForm('PRG','${p.id}')` },
    { ok: !!p.outcome, t:'Hasil akhir peserta terisi', a:`openForm('PRG','${p.id}')` },
    { ok: mods.length > 0, t:'Program punya modul', a:`prgOpen('${p.id}','mod')` },
    { ok: notReady.length === 0, t:'Semua modul siap digunakan',
      sub: notReady.length ? notReady.length + ' modul belum siap' : '', a:`prgOpen('${p.id}','mod')` },
    { ok: d !== null && Math.abs(d) <= 5, t:'Durasi sesuai target',
      sub: d === null ? 'Target durasi belum diisi' : (d === 0 ? '' : (d > 0 ? 'Kelebihan ' + d + ' menit' : 'Kurang ' + (-d) + ' menit')),
      a:`prgOpen('${p.id}','run')` },
    { ok: stale.length === 0, t:'Versi modul yang dipakai masih mutakhir',
      sub: stale.length ? stale.length + ' modul berubah setelah disematkan' : '', a:`prgOpen('${p.id}','mod')` }
  ];
}
function checkList(rows){
  return `<div class="list">${rows.map(c => `
    <div class="row-i" style="align-items:flex-start;cursor:${c.ok?'default':'pointer'}" ${c.ok?'':`onclick="${c.a}"`}>
      <span style="flex:0 0 18px;color:${c.ok?'var(--green)':(c.soft?'var(--text-3)':'var(--orange)')};font-weight:800">${c.ok?'✓':'○'}</span>
      <span style="flex:1"><span class="t" style="font-weight:${c.ok?500:600}">${h(c.t)}</span>
      ${c.sub?`<span class="s">${h(c.sub)}</span>`:''}</span>
      ${c.ok?'':'<span class="mini">perbaiki →</span>'}</div>`).join('')}</div>`;
}

let L6 = { q:'', jenis:'', topik:'', st:'', dari:'', sampai:'', refl:'' };

function l6Set(k, v){ L6[k] = v; go(CUR); }
function l6Reset(){ L6 = { q:'', jenis:'', topik:'', st:'', dari:'', sampai:'', refl:'' }; go(CUR); }
const l6Aktif = () => Object.keys(L6).filter(k => L6[k]).length;

/* Topik dibaca dari record, bukan dari daftar tetap: kalau Anda menulis
   topik baru, saringannya langsung mengenalnya. */
function l6Topik(){
  const set = {};
  recs('LRN').forEach(r => String(r.topic || '').split(',').map(s => s.trim())
    .filter(Boolean).forEach(t => { set[t] = (set[t] || 0) + 1; }));
  return Object.keys(set).sort((a, b) => set[b] - set[a] || a.localeCompare(b));
}

function l6Filter(){
  const q = L6.q.toLowerCase();
  return recs('LRN').filter(r => {
    if(L6.jenis && (r.jenis || '') !== L6.jenis) return false;
    if(L6.st && (r.st || '') !== L6.st) return false;
    if(L6.topik){
      const ts = String(r.topic || '').split(',').map(s => s.trim());
      if(ts.indexOf(L6.topik) === -1) return false;
    }
    /* Record tanpa tanggal TIDAK dibuang oleh saringan periode, dan tidak
       diberi tanggal karangan. Ia hanya tidak ikut saat periode dipakai —
       dan itu dikatakan di layar. */
    if(L6.dari && !(r.date && r.date >= L6.dari)) return false;
    if(L6.sampai && !(r.date && r.date <= L6.sampai)) return false;
    if(L6.refl === 'ada' && !String(r.lesson || '').trim()) return false;
    if(L6.refl === 'belum' && String(r.lesson || '').trim()) return false;
    if(q){
      const bl = [r.n, r.note, r.summary, r.lesson, r.apply, r.src, r.author, r.topic, r.id]
        .map(x => String(x || '').toLowerCase()).join(' ');
      if(bl.indexOf(q) === -1) return false;
    }
    return true;
  });
}

           ditampilkan sekarang, dan <b>tidak diberi tanggal karangan</b>.`
        : `${st.noDate ? st.noDate + ' di antaranya belum punya tanggal pembelajaran — dibiarkan kosong, bukan diisi hari ini.' : 'Semua punya tanggal pembelajaran.'}`}
    </div></div>`;

  const angka = `<div class="card" style="margin-bottom:16px">
    ${cardH('check','Hitungan','gray','<span class="mini">dihitung, bukan disimpulkan</span>')}
    <div class="flexr" style="gap:10px;flex-wrap:wrap">
      ${[['Cocok saringan', st.n, 'dari ' + semua.length + ' record'],
         ['Ada pelajaran', st.pel, st.n ? Math.round(st.pel / st.n * 100) + '% dari yang cocok' : 'belum ada yang cocok'],
         ['Ada rencana penerapan', st.tap, st.n ? Math.round(st.tap / st.n * 100) + '% dari yang cocok' : '—']]

      ada yang ditampilkan seolah-olah ada.</span></div></div>`;

  const papan = rows.length

        ${semua.length} record lain tetap ada dan tidak terhapus.</div></div>`;

  return tangkap + saring + angka + papan + knLuar('LRN', rows, LRN_ST);
}

/* ---------------- 5. RECORD YANG TIDAK MUNCUL DI PAPAN ----------------
   Papan menyusun kartu menurut kolom status. Record yang statusnya masih
   kosong karena itu TIDAK punya kolom, dan kalau dibiarkan ia hilang dari
   pandangan tanpa pemberitahuan — padahal datanya ada.

   Status tidak diisi sendiri di sini: mengisi diam-diam berarti sistem
   menyatakan sesuatu atas nama pemiliknya. Yang dilakukan hanya
   mengatakan bahwa record itu ada, lalu menyediakan tombolnya. */
function knLuar(T, rows, opt){
  const luar = rows.filter(r => !String(r.st || '').trim());
  if(!luar.length) return '';
  const S = SCHEMA[T];
  return `<div class="card" style="margin-top:16px">
    ${cardH('info','Belum muncul di papan','orange',`<span class="pill orange">${luar.length}</span>`)}
    <div class="mini" style="margin-bottom:10px">Record ini <b>belum punya status</b>, jadi tidak ada kolom
      yang bisa menampungnya di papan. Datanya tetap ada dan tidak terhapus.
      <b>Statusnya tidak diisi sendiri</b> — Anda yang menentukan, karena status adalah pernyataan Anda.</div>
    <div class="list">${luar.map(r => `
      <div class="row-i" style="align-items:flex-start">
        ${ic(S.ic)}<span style="flex:1"><span class="t">${h(S.t(r) || r.id)}</span>
        <span class="s">${r.id}</span>
        <span class="flexr" style="gap:7px;margin-top:8px;flex-wrap:wrap">
          ${opt.map(o => `<button class="btn ghost sm" onclick="knSetSt('${r.id}','${h(o)}')">${h(o)}</button>`).join('')}
          <button class="btn ghost sm" onclick="recDetail('${r.id}')">Buka</button>
        </span></span>
        <span class="pill dummy">TANPA STATUS</span></div>`).join('')}</div></div>`;
}

/* Satu perubahan kolom, dicatat seperti perpindahan kartu biasa. */
function knSetSt(id, st){
  const r = recById(id); if(!r) return;
  const T = typeOf(r);
  const before = Object.assign({}, r, { _priv: r._m.privacy_level });
  r.st = st;
  r._m.updated_at = new Date().toISOString(); r._m.updated_by = DB.owner.name;
  logAct('UPDATE', r, 'status diisi dari daftar tanpa status',
    diffRec(before, Object.assign({}, r, { _priv: r._m.privacy_level }), T));
  if(!saveStore()){ toast('Belum tersimpan — periksa ruang penyimpanan peramban'); return; }
  toast(r.id + ' → ' + st);
  go(CUR);
}
/* ================= NP-V07 · DO =================
   Paket pembangunan NP-V07. BUKAN fase roadmap.

   Ketentuan yang dipegang di berkas ini:

   - Entitas tetap PRK dari NP-01. Tidak ada tabel atau form paralel.
   - Papan memakai mesin geser yang sudah teruji (p23_board.js).
   - KOREKSI MOCKUP: di gambar NV-07 tab "Bukti" tampak aktif padahal
     yang semestinya terbuka lebih dulu adalah "Rencana". Mockup adalah
     acuan desain, bukan bukti fitur berjalan — jadi yang dipakai di sini
     urutan yang benar: Rencana lebih dulu, Bukti paling akhir.
   - TIDAK ADA hasil atau tanggal historis palsu. Kolom hasil yang belum
     ditulis tampil sebagai "belum ditulis", bukan diisi kalimat contoh.
     Tanggal yang kosong tetap kosong — tidak diisi hari ini, dan tidak
     ditebak dari tanggal pembuatan record.
   - "Dilakukan" tidak sama dengan "berhasil", dan itu ditulis di layar
     tempat statusnya diubah. */

/* ---------------- 1. SARINGAN ---------------- */

let D7 = { q:'', kind:'', st:'', dari:'', sampai:'', hasil:'', sumber:'' };

function d7Set(k, v){ D7[k] = v; go(CUR); }
function d7Reset(){ D7 = { q:'', kind:'', st:'', dari:'', sampai:'', hasil:'', sumber:'' }; go(CUR); }
const d7Aktif = () => Object.keys(D7).filter(k => D7[k]).length;

function d7Filter(){
  const q = D7.q.toLowerCase();
  return recs('PRK').filter(r => {
    if(D7.kind && (r.kind || '') !== D7.kind) return false;
    if(D7.st && (r.st || '') !== D7.st) return false;
    /* Periode memakai tanggal MULAI. Yang belum punya tanggal tidak ikut
       saat periode dipakai, dan tidak diberi tanggal karangan. */
    if(D7.dari && !(r.start && r.start >= D7.dari)) return false;
    if(D7.sampai && !(r.start && r.start <= D7.sampai)) return false;
    if(D7.hasil === 'ada' && !String(r.res || '').trim()) return false;
    if(D7.hasil === 'belum' && String(r.res || '').trim()) return false;
    if(D7.sumber === 'ada' && !r.learn) return false;
    if(D7.sumber === 'tanpa' && r.learn) return false;
    if(q){
      const bl = [r.n, r.note, r.sit, r.goal, r.act, r.chal, r.res, r.refl, r.next, r.id]
        .map(x => String(x || '').toLowerCase()).join(' ');
      if(bl.indexOf(q) === -1) return false;
    }
    return true;
  });
}

/* ---------------- 3. DETAIL BERTAB ----------------
   Panel semuanya digambar sekaligus lalu disembunyikan, bukan digambar
   ulang per klik: lebih sederhana, dan tidak ada keadaan setengah jadi
   kalau satu panel gagal dirender.

   Urutan tab: Rencana → Tindakan → Hasil → Bukti. Yang aktif saat dibuka
   adalah Rencana. Mockup NV-07 memperlihatkan Bukti yang aktif; itu
   dikoreksi di sini, dan dicatat supaya tidak "diperbaiki" kembali. */

function npTabGo(grup, kunci){
  const wrap = document.getElementById('tabs-' + grup);
  if(!wrap) return;
  wrap.querySelectorAll('[data-tabk]').forEach(b => {
    const on = b.getAttribute('data-tabk') === kunci;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  wrap.querySelectorAll('[data-panelk]').forEach(p => {
    p.hidden = p.getAttribute('data-panelk') !== kunci;
  });
}

/* Satu blok teks. Kosong ditulis "belum ditulis" — tidak diisi contoh,

}

function d7Detail(r){

            : '<div class="mini" style="margin-bottom:12px">Tidak ditautkan ke pembelajaran mana pun — dan itu sah, pengalaman tidak harus lahir dari bacaan.</div>'}
      ${d7Blok('Situasi', r.sit)}
      ${d7Blok('Tujuan', r.goal)}`,
    tindakan:
      d7Blok('Tindakan', r.act) +
      d7Blok('Tantangan', r.chal),
    hasil:
      d7Blok('Hasil yang tercatat', r.res,
        'Yang tertulis di sini adalah apa yang terjadi menurut catatan Anda. ' +
        '<b>Status "Dilakukan" tidak berarti berhasil</b>, dan tidak ada hasil yang diisi sendiri oleh sistem.') +
      d7Blok('Pelajaran / refleksi', r.refl) +
      d7Blok('Langkah berikutnya', r.next),
    bukti:

        'nama berkas, atau di mana benda itu berada. Kosong berarti belum ada rujukan yang ditulis, ' +
        'bukan berarti buktinya hilang.')
  };

  return `<div id="tabs-prk-${r.id}" class="np-tabs">
    <div class="tabbar" role="tablist">${TAB.map(([k, n], i) =>
      `<button role="tab" data-tabk="${k}" class="${i === 0 ? 'on' : ''}"

    ${TAB.map(([k], i) => `<div data-panelk="${k}"${i === 0 ? '' : ' hidden'}>${panel[k]}</div>`).join('')}
  </div>`;
}

/* Menyisip ke detail record yang sudah ada, dengan membungkus kait NP-01

function d7Hitung(rows){

  };
}

function aiAnswer(q){
  const s=q.toLowerCase();
  const hit=AI_BRAIN.find(b=>b.k.some(k=>s.includes(k)));
  if(hit) return hit.a();
  return `Saya belum punya jawaban spesifik untuk itu, tapi saya bisa lihat lintas modul. Coba tanya soal agenda, keputusan, cash, proyek, relasi, wellbeing, keluarga, travel, atau dampak sosial.\n\nContoh: "Apa tiga hal paling penting hari ini?"`;
}
let CHAT=[];
function openAI(q){
  document.getElementById('aiDr').classList.add('on');
  if(!CHAT.length){ CHAT.push({r:'ai',t:`Selamat datang, Aji. Saya sudah membaca closing **Juli 2026** dari Finance Drive.\n\nRingkasnya: bulan terbaik tahun ini — revenue ${money(DB.fin.rev)} (+5,4%), laba ${money(DB.fin.profit)} (+22,5%), kas ${money(DB.fin.cash)} (+22,5%).\n\nDua hal yang menahan: **Bisma** di margin 8,6% dengan akumulasi rugi Rp 1,05 M, dan **piutang ${money(DB.fin.ar)}** yang naik dua kali lipat sejak April.\n\nApa yang ingin Anda dalami lebih dulu?`}); }
  document.getElementById('aiSug').innerHTML = AI_Q.slice(0,4).map(x=>`<button class="chip" style="font-size:11.5px;padding:4px 10px" onclick="ask('${esc(x)}')">${x}</button>`).join('');
  renderChat();
  if(q) setTimeout(()=>ask(q),160);
}
const closeAI=()=>document.getElementById('aiDr').classList.remove('on');
function renderChat(){
  document.getElementById('chat').innerHTML = CHAT.map(m=>
    `<div class="bub ${m.r}">${m.t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</div>`).join('');
  const b=document.querySelector('#aiDr .dr-b'); if(b) b.scrollTop=b.scrollHeight;
}
function ask(q){ CHAT.push({r:'me',t:q}); renderChat();
  setTimeout(()=>{ CHAT.push({r:'ai',t:aiAnswer(q)}); renderChat(); },380); }
function sendAI(){ const i=document.getElementById('aiIn'); const v=(i.value||'').trim(); if(!v)return; i.value=''; ask(v); }

/* ---------------- GLOBAL SEARCH / COMMAND PALETTE ---------------- */
function searchAll(q){
  const s=q.toLowerCase().trim(); const R=[];
  const add=(g,t,sub,fn,k)=>R.push({g,t,sub,fn,k});
  if(!s){
    add('Perintah','Ask Aji AI Chief of Staff','Tanya apa saja tentang hidup & bisnis Anda','openAI()','↵');
    add('Perintah','Morning Dharma Briefing','Ringkasan pagi 11 bagian','morningBrief()');
    add('Perintah','Daily Check-in','Catat energi, stres, mood, tidur','checkin()');
    add('Perintah','Weekly Life by Design Review','Skor 10 dimensi','weeklyReview()');
    add('Perintah','Customize Dashboard','Tambah, hapus, urutkan kartu','customizeDash()');
    add('Perintah','Tambah Baru (+ Add)','Task, Meeting, Person, Note, Idea, Project, Decision…','openCreate()');
    add('Perintah','Buka Global Inbox','Antrean tangkapan yang belum dirutekan','openInbox()');
    add('Perintah','Data Saya','Semua record asli yang Anda entri · ekspor CSV','fTab=\'mydata\';go(\'foundation\')');
    add('Perintah','System Foundation','Arsitektur, sumber data, dummy data, audit','go(\'foundation\')');
    NAV.forEach(n=>add('Navigasi',n.n,'Buka modul','go(\''+n.id+'\')'));
    return R;
  }
  NAV.filter(n=>n.n.toLowerCase().includes(s)).forEach(n=>add('Navigasi',n.n,'Modul','go(\''+n.id+'\')'));
  /* Record asli buatan pengguna — selalu ikut dicari, apa pun mode data contoh */
  SCH_ORDER.forEach(ty=>{
    const S=SCHEMA[ty];
    recs(ty).filter(r=>JSON.stringify(r).toLowerCase().includes(s))
      .forEach(r=>add(S.n+' · data asli', S.t(r), (S.s(r)||'')+' · '+r.id, `recDetail('${r.id}')`));
  });
  if(dummyOn()){
  DB.people.filter(p=>(p.n+p.org+p.pos+p.cat).toLowerCase().includes(s)).forEach(p=>add('People',p.n,p.pos+' · '+p.org,`personDetail('${p.id}')`));
  DB.units.filter(u=>(u.name+u.cat).toLowerCase().includes(s)).forEach(u=>add('Business Unit',u.name,u.cat,`unitDetail('${u.id}')`));
  DB.projects.filter(p=>(p.n+p.unit+p.cat).toLowerCase().includes(s)).forEach(p=>add('Projects',p.n,p.unit+' · '+p.st,`prjDetail('${p.id}')`));
  DB.decisions.filter(d=>(d.n+d.unit).toLowerCase().includes(s)).forEach(d=>add('Decisions',d.n,d.unit+' · '+d.due,`decDetail('${d.id}')`));
  DB.knowledge.filter(k=>(k.t+k.cat+k.type+k.ex).toLowerCase().includes(s)).forEach(k=>add('Knowledge',k.t,k.type+' · '+k.cat,`kDetail('${k.id}')`));
  DB.trips.filter(t=>(t.dest+t.country+t.type).toLowerCase().includes(s)).forEach(t=>add('Travel','Trip '+t.dest,t.dep+' · '+t.type,`tripDetail('${t.id}')`));
  DB.social.filter(x=>x.n.toLowerCase().includes(s)).forEach(x=>add('Social Movement',x.n,x.role,`socDetail('${x.id}')`));
  DB.content.filter(c=>c.t.toLowerCase().includes(s)).forEach(c=>add('Content',c.t,c.pil+' · '+c.st,`go('brand')`));
  DB.schedule.filter(e=>e.n.toLowerCase().includes(s)).forEach(e=>add('Kalender',e.n,e.t+' · '+e.tag,`go('myday')`));
  DB.family.filter(f=>f.n.toLowerCase().includes(s)).forEach(f=>add('Family',f.n,f.rel,`famDetail('${f.id}')`));
  DB.ops.filter(o=>o.n.toLowerCase().includes(s)).forEach(o=>add('Operations',o.n,o.unit+' · health '+o.health,`go('operations')`));
  }
  add('AI','Tanya "'+h(q)+'" ke AI Chief of Staff','Jawaban lintas modul',`openAI('${esc(q)}')`,'↵');
  return R;
}
let palSel=0, palRes=[];
function renderPal(){
  const q=document.getElementById('palIn').value; palRes=searchAll(q); palSel=0;
  let html='', last='';
  palRes.slice(0,40).forEach((r,i)=>{
    if(r.g!==last){html+=`<div class="pal-g">${r.g}</div>`;last=r.g;}
    html+=`<div class="pal-i ${i===0?'sel':''}" data-i="${i}" onclick="runPal(${i})">
      <div style="width:26px;height:26px;border-radius:8px;background:var(--gold-tint);color:var(--gold-dark);display:grid;place-items:center;flex:0 0 26px">${ic(r.g==='People'?'users':r.g==='Projects'?'layers':r.g==='Decisions'?'scale':r.g==='Knowledge'?'book':r.g==='Travel'?'plane':r.g==='AI'?'spark':r.g==='Perintah'?'bolt':'grid')}</div>
      <div style="min-width:0"><div class="t">${r.t}</div><div class="s">${r.sub}</div></div>${r.k?`<span class="k">${r.k}</span>`:''}</div>`;
  });
  document.getElementById('palB').innerHTML = html||'<div class="empty">Tidak ada hasil. Coba kata kunci lain.</div>';
}
function runPal(i){const r=palRes[i]; if(!r)return; closePal(); try{eval(r.fn)}catch(e){toast('Membuka '+r.t)}}
function openPal(){document.getElementById('palOv').classList.add('on');const i=document.getElementById('palIn');i.value='';renderPal();setTimeout(()=>i.focus(),40);}
const closePal=()=>document.getElementById('palOv').classList.remove('on');

/* ---------------- INIT ---------------- */
document.getElementById('palIn').addEventListener('input',renderPal);
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal();return;}
  if(e.key==='Escape'){closePal();closeModal();closeNotif();closeAI();closeInbox();}
  if(document.getElementById('palOv').classList.contains('on')){
    const n=document.querySelectorAll('.pal-i');
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();
      n[palSel]&&n[palSel].classList.remove('sel');
      palSel=(palSel+(e.key==='ArrowDown'?1:-1)+n.length)%n.length;
      n[palSel]&&n[palSel].classList.add('sel'); n[palSel]&&n[palSel].scrollIntoView({block:'nearest'});}
    if(e.key==='Enter'){e.preventDefault();runPal(palSel);}
  }
});
