<title>Aji Jaens OS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
/* ============ AJI JAENS OS — LIFE BY DESIGN ============ */
:root{
  --bg:#FAF8F2; --bg-2:#F5F1E7;
  --surface:#FFFDF8; --surface-2:#F8F5EC; --surface-3:#F3EFE4;
  --border:#EAE3D2; --border-soft:#F1EBDC;
  --text:#2A2620; --text-2:#6A6255; --text-3:#9B9284;
  --gold:#B58A3A; --gold-soft:#C9A85A; --gold-champ:#D7BE7A; --gold-dark:#8E681F;
  --gold-tint:#FAF2E2; --gold-line:#E7D9B8;
  --blue:#1A73E8; --blue-t:#E8F0FE;
  --green:#12874E; --green-t:#E4F3EA;
  --red:#D0342C;  --red-t:#FBE9E7;
  --orange:#DD6B0D; --orange-t:#FDEEE0;
  --purple:#7C3AED; --purple-t:#F1E9FE;
  --pink:#D43B7E; --pink-t:#FCE8F1;
  --teal:#00857A; --teal-t:#E0F2F0;
  --yellow:#C98A00; --yellow-t:#FDF3DC;
  --gray:#8A8377; --gray-t:#F0EDE5;
  --shadow:0 1px 2px rgba(80,62,26,.05), 0 6px 20px -8px rgba(80,62,26,.10);
  --shadow-lg:0 2px 6px rgba(80,62,26,.07), 0 18px 44px -18px rgba(80,62,26,.22);
  --r:16px; --r-sm:11px; --r-lg:22px;
  --sw:252px;
  --ff:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fd:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14120E; --bg-2:#0F0E0B;
    --surface:#1C1915; --surface-2:#221E18; --surface-3:#2A251E;
    --border:#332D24; --border-soft:#2A251E;
    --text:#F0EADD; --text-2:#B3AA97; --text-3:#7E7666;
    --gold:#D7BE7A; --gold-soft:#C9A85A; --gold-champ:#E4D0A0; --gold-dark:#B58A3A;
    --gold-tint:#241E12; --gold-line:#3D3320;
    --blue:#7CB0F7; --blue-t:#152438;
    --green:#5FD394; --green-t:#122A1E;
    --red:#F58E85;  --red-t:#301917;
    --orange:#F0A45C; --orange-t:#2E2015;
    --purple:#BFA0FB; --purple-t:#221936;
    --pink:#F08CBB; --pink-t:#301826;
    --teal:#5CC9BD; --teal-t:#0F2A28;
    --yellow:#EFC259; --yellow-t:#2C2413;
    --gray:#9A9384; --gray-t:#232019;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px -8px rgba(0,0,0,.5);
    --shadow-lg:0 2px 6px rgba(0,0,0,.45), 0 18px 44px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#14120E; --bg-2:#0F0E0B;
  --surface:#1C1915; --surface-2:#221E18; --surface-3:#2A251E;
  --border:#332D24; --border-soft:#2A251E;
  --text:#F0EADD; --text-2:#B3AA97; --text-3:#7E7666;
  --gold:#D7BE7A; --gold-soft:#C9A85A; --gold-champ:#E4D0A0; --gold-dark:#B58A3A;
  --gold-tint:#241E12; --gold-line:#3D3320;
  --blue:#7CB0F7; --blue-t:#152438;
  --green:#5FD394; --green-t:#122A1E;
  --red:#F58E85;  --red-t:#301917;
  --orange:#F0A45C; --orange-t:#2E2015;
  --purple:#BFA0FB; --purple-t:#221936;
  --pink:#F08CBB; --pink-t:#301826;
  --teal:#5CC9BD; --teal-t:#0F2A28;
  --yellow:#EFC259; --yellow-t:#2C2413;
  --gray:#9A9384; --gray-t:#232019;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px -8px rgba(0,0,0,.5);
  --shadow-lg:0 2px 6px rgba(0,0,0,.45), 0 18px 44px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ff);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
img{max-width:100%}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--gold-champ);color:#2A2620}
.app{display:flex;min-height:100vh}

/* ---------- SIDEBAR ---------- */
.sidebar{width:var(--sw);flex:0 0 var(--sw);background:var(--bg);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:60;transition:width .22s ease,transform .22s ease}
.sb-logo{padding:22px 20px 14px;}
.sb-logo img{width:158px;display:block}
.sb-me{margin:2px 12px 10px;padding:10px;border-radius:var(--r);display:flex;gap:10px;align-items:center;cursor:pointer;transition:background .15s}
.sb-me:hover{background:var(--surface-2)}
.sb-me>div{overflow:hidden}
#modeLabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-nav{flex:1;overflow-y:auto;padding:4px 12px 12px;scrollbar-width:thin}
.sb-nav::-webkit-scrollbar{width:5px}.sb-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}
.nav-i{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:11px;color:var(--gold-dark);
  font-weight:600;font-size:13.5px;letter-spacing:.1px;margin-bottom:2px;cursor:pointer;transition:.15s;width:100%;text-align:left}
.nav-i svg{width:18px;height:18px;flex:0 0 18px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-i:hover{background:var(--gold-tint)}
.nav-i.on{background:var(--blue);color:#fff;box-shadow:0 6px 16px -6px rgba(26,115,232,.6)}
.nav-i.on svg{stroke:#fff}
.nav-i .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px}
.nav-i.on .badge{background:rgba(255,255,255,.25)}
.sb-ai{margin:10px 12px;padding:13px;border-radius:var(--r);background:linear-gradient(150deg,var(--purple-t),var(--gold-tint));border:1px solid var(--border-soft)}
.sb-foot{display:flex;gap:4px;align-items:center;padding:10px 16px 14px;border-top:1px solid var(--border-soft)}
.icobtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--text-2);transition:.15s}
.icobtn:hover{background:var(--surface-2);color:var(--gold-dark)}
.icobtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.scrim{display:none;position:fixed;inset:0;background:rgba(24,20,12,.45);z-index:55;backdrop-filter:blur(2px)}

/* ---------- MAIN / TOPBAR ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:12px;padding:12px 22px}
.tb-menu{display:none}
.search{flex:0 1 460px;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:8px 12px;color:var(--text-3);cursor:pointer;transition:.15s;min-width:0}
.search:hover{border-color:var(--gold-line);box-shadow:var(--shadow)}
.search svg{width:16px;height:16px;stroke:var(--text-3);fill:none;stroke-width:1.9;flex:0 0 16px}
.search span{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbd{font-size:10.5px;font-weight:600;border:1px solid var(--border);border-radius:6px;padding:2px 6px;color:var(--text-3);background:var(--surface-2)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.dot-b{position:relative}
.dot-b b{position:absolute;top:0;right:0;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;border-radius:20px;padding:0 5px;line-height:15px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;
  background:linear-gradient(140deg,var(--gold-soft),var(--gold-dark));flex:0 0 auto;letter-spacing:.3px}
.avatar.sm{width:28px;height:28px;font-size:11px}
.avatar.lg{width:44px;height:44px;font-size:15px}
.avatar.ring{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--green)}

/* ---------- VIEW ---------- */
.view{padding:24px 26px 60px;max-width:1480px;width:100%;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{font-family:var(--fd);font-size:34px;font-weight:600;margin:0;letter-spacing:-.2px;color:var(--text)}
.page-h p{margin:3px 0 0;color:var(--text-2);font-size:13.5px}
.page-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- GRID ---------- */
.g{display:grid;gap:16px;margin-bottom:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr;align-items:start}
.g12{grid-template-columns:1fr 2fr;align-items:start}
.g.top{align-items:start}
.g.gsched{grid-template-columns:1.5fr 1fr 1fr 1fr}
.span2{grid-column:span 2}

/* ---------- CARD ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);
  position:relative;transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s,border-color .18s;min-width:0}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--gold-line)}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.card-h .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:0 0 28px}
.card-h .ic svg{width:15px;height:15px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card-h h3{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--gold-dark)}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-f{margin-top:14px;padding-top:12px;border-top:1px solid var(--border-soft)}
.linkr{color:var(--blue);font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.linkr:hover{text-decoration:underline}
.card .sub{color:var(--text-2);font-size:12.5px;margin:2px 0 0}

/* KPI */
.kpi .val{font-family:var(--fd);font-size:33px;font-weight:600;line-height:1.05;letter-spacing:-.5px}
.kpi .val small{font-size:15px;color:var(--text-3);font-family:var(--ff);font-weight:600}
.kpi .lbl{font-size:12.5px;color:var(--text-2);margin-top:2px}
.kpi .row{display:flex;align-items:flex-end;gap:10px;justify-content:space-between}
.trend{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;margin-top:8px}
.trend.up{color:var(--green)}.trend.dn{color:var(--red)}.trend.fl{color:var(--text-3)}
.trend em{font-style:normal;color:var(--text-3);font-weight:500}

/* pills / chips */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.2px;white-space:nowrap}
.pill.blue{background:var(--blue-t);color:var(--blue)} .pill.green{background:var(--green-t);color:var(--green)}
.pill.red{background:var(--red-t);color:var(--red)} .pill.orange{background:var(--orange-t);color:var(--orange)}
.pill.purple{background:var(--purple-t);color:var(--purple)} .pill.pink{background:var(--pink-t);color:var(--pink)}
.pill.teal{background:var(--teal-t);color:var(--teal)} .pill.yellow{background:var(--yellow-t);color:var(--yellow)}
.pill.gray{background:var(--gray-t);color:var(--gray)} .pill.gold{background:var(--gold-tint);color:var(--gold-dark)}
.pill.dummy{background:var(--orange-t);color:var(--orange);border:1px dashed var(--orange)}
.dummybar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 16px;margin-bottom:18px;border-radius:var(--r);
  background:repeating-linear-gradient(135deg,var(--orange-t),var(--orange-t) 12px,transparent 12px,transparent 24px);
  border:1px dashed var(--orange);font-size:12.5px;color:var(--text-2)}
.dummybar b{color:var(--text)}
.dummybar code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--surface);padding:1px 5px;border-radius:5px}
.statebar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:13px 16px;margin-bottom:18px;border-radius:var(--r);
  background:var(--blue-t);border:1px solid var(--blue);font-size:12.5px;color:var(--text-2)}
.statebar.del{background:var(--red-t);border-color:var(--red)}
.statebar b{color:var(--text)}
.statebar code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--surface);padding:1px 5px;border-radius:5px}
.dbadge{font-size:10.5px;font-weight:800;letter-spacing:1.2px;background:var(--orange);color:#fff;padding:4px 10px;border-radius:6px;flex:0 0 auto}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border-soft)}
.stat b{font-family:var(--fd);font-size:23px;font-weight:600;line-height:1}
.stat span{font-size:11.5px;color:var(--text-3)}
.tabbar{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tabbar button{padding:9px 14px;font-size:13px;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabbar button:hover{color:var(--gold-dark)}
.tabbar button.on{color:var(--gold-dark);border-bottom-color:var(--gold)}
.chip{display:inline-flex;align-items:center;border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:5px 13px;font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer;transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--gold);color:var(--gold-dark)}
.chip.on{background:var(--gold-tint);border-color:var(--gold);color:var(--gold-dark)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:11px;padding:8px 15px;font-size:13px;font-weight:600;transition:.16s;white-space:nowrap;border:1px solid transparent}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn.gold{border-color:var(--gold);color:var(--gold-dark);background:transparent}
.btn.gold:hover{background:var(--gold-tint)}
.btn.solid{background:var(--blue);color:#fff}
.btn.solid:hover{filter:brightness(1.08)}
.btn.ghost{color:var(--text-2);border-color:var(--border);background:var(--surface)}
.btn.ghost:hover{border-color:var(--gold-line);color:var(--gold-dark)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:9px}
.btn.pur{background:var(--purple);color:#fff}
.btn.grn{border-color:var(--green);color:var(--green)}
.btn.red{border-color:var(--red);color:var(--red)}

/* list rows */
.rows{display:flex;flex-direction:column}
.row-i{display:flex;align-items:center;gap:11px;padding:10px 8px;border-radius:11px;cursor:pointer;transition:.14s;margin:0 -8px}
.row-i:hover{background:var(--surface-2)}
.row-i .t{display:block;font-weight:600;font-size:13.5px;line-height:1.35}
.row-i .s{display:block;font-size:12px;color:var(--text-3);line-height:1.35}
.row-i .rt{margin-left:auto;text-align:right;flex:0 0 auto}
.row-i>svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--gold)}
.datafoot{margin-top:26px;padding:15px 18px;border:1px dashed var(--gold-line);border-radius:var(--r);background:var(--gold-tint);
  display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
.datafoot b{color:var(--gold-dark)}
.sep{height:1px;background:var(--border-soft);margin:4px 0}

/* timeline */
.tl{position:relative;padding-left:4px}
.tl-i{display:flex;gap:12px;padding:7px 0;cursor:pointer;border-radius:10px;transition:.14s;margin:0 -8px;padding-left:8px;padding-right:8px}
.tl-i:hover{background:var(--surface-2)}
.tl-i .tm{font-size:12px;font-weight:700;color:var(--text-2);flex:0 0 44px;padding-top:2px;font-variant-numeric:tabular-nums}
.tl-i .bar{width:3px;height:auto;align-self:stretch;border-radius:3px;flex:0 0 3px;background:var(--blue);overflow:visible}
.tl-i .bd{flex:1;min-width:0}
.tl-i .bd b{display:block;font-size:13.5px;font-weight:600}
.tl-i .bd span{font-size:11.5px;color:var(--text-3)}

/* priority rows */
.pr{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.16s;border:1px solid transparent}
.pr:hover{transform:translateX(2px)}
.pr .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:0 0 22px;margin-top:1px}
.pr b{display:block;font-size:13.5px;font-weight:600}
.pr span{font-size:11.5px;color:var(--text-3)}

/* progress */
.bar{height:6px;border-radius:8px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;transition:width .7s cubic-bezier(.2,.8,.3,1)}
.meter{display:flex;gap:3px}
.meter i{height:6px;flex:1;border-radius:4px;background:var(--surface-3)}

/* AI banner */
.aibanner{border-radius:var(--r-lg);padding:20px 22px;color:#fff;display:flex;gap:22px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(105deg,#5B3BD6,#8B5CF6 45%,#A855F7 72%,#C084FC);box-shadow:0 14px 34px -14px rgba(124,58,237,.6);position:relative;overflow:hidden}
.aibanner:before{content:"";position:absolute;right:-40px;top:-60px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.10)}
.aibanner .lb{font-size:10.5px;font-weight:800;letter-spacing:1.3px;opacity:.85;text-transform:uppercase}
.aibanner h4{margin:6px 0 0;font-size:16.5px;font-weight:600;line-height:1.45;max-width:520px}
.aibanner .acts{display:flex;flex-direction:column;gap:7px;font-size:13px;position:relative}
.aibanner .acts .t{font-size:11px;font-weight:800;letter-spacing:1px;opacity:.8;text-transform:uppercase;margin-bottom:1px}
.aibanner .ai-act{display:flex;gap:8px;align-items:center;cursor:pointer;opacity:.95}
.aibanner .ai-act:hover{opacity:1}
.aibanner .bx{width:15px;height:15px;border-radius:4px;border:1.6px solid rgba(255,255,255,.8);display:grid;place-items:center;font-size:10px;flex:0 0 15px}
.aibanner .ai-act.done .bx{background:#fff;color:var(--purple)}
.aibanner .btnw{margin-left:auto;position:relative}
.btn-w{background:rgba(255,255,255,.95);color:#6D28D9;border-radius:11px;padding:9px 16px;font-weight:700;font-size:13px;display:inline-flex;gap:7px;align-items:center}
.btn-w:hover{background:#fff}

/* section title */
.sect{display:flex;align-items:center;gap:12px;margin:28px 0 14px}
.sect h2{font-family:var(--fd);font-size:24px;font-weight:600;margin:0}
.sect p{margin:0;color:var(--text-2);font-size:13px}
.sect .sp{margin-left:auto;display:flex;gap:8px}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);padding:0 12px 9px;white-space:nowrap}
.tbl td{padding:11px 12px;border-top:1px solid var(--border-soft);vertical-align:middle}
.tbl tbody tr{cursor:pointer;transition:.14s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}

/* modal / drawer / palette */
.ov{position:fixed;inset:0;background:rgba(28,22,12,.42);backdrop-filter:blur(3px);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:60px 18px}
.ov.on{display:flex;animation:fade .18s ease}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:100%;max-width:660px;max-height:82vh;overflow:auto;animation:pop .22s cubic-bezier(.2,.9,.3,1)}
.sheet.wide{max-width:900px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.sheet-h{padding:20px 22px 14px;border-bottom:1px solid var(--border-soft);display:flex;gap:12px;align-items:flex-start;position:sticky;top:0;background:var(--surface);z-index:2}
.sheet-h h3{margin:0;font-family:var(--fd);font-size:23px;font-weight:600}
.sheet-h p{margin:3px 0 0;font-size:12.5px;color:var(--text-2)}
.sheet-b{padding:20px 22px 24px}
.sheet-f{padding:14px 22px;border-top:1px solid var(--border-soft);display:flex;gap:9px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.x{margin-left:auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--text-3);font-size:19px;line-height:1}
.x:hover{background:var(--surface-2);color:var(--text)}
.kv{display:grid;grid-template-columns:132px 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--text-3);font-size:12px;font-weight:600}
.kv dd{margin:0;font-weight:500}

/* command palette */
.pal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:100%;max-width:620px;overflow:hidden;animation:pop .2s cubic-bezier(.2,.9,.3,1)}
.pal-in{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--border-soft)}
.pal-in input{flex:1;border:0;outline:0;background:none;font-size:16px;color:var(--text);font-family:inherit}
.pal-in input::placeholder{color:var(--text-3)}
.pal-b{max-height:56vh;overflow:auto;padding:8px}
.pal-g{font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--text-3);padding:10px 12px 5px}
.pal-i{display:flex;gap:11px;align-items:center;padding:9px 12px;border-radius:11px;cursor:pointer}
.pal-i:hover,.pal-i.sel{background:var(--gold-tint)}
.pal-i .t{font-weight:600;font-size:13.5px}
.pal-i .s{font-size:11.5px;color:var(--text-3)}
.pal-i .k{margin-left:auto;font-size:11px;color:var(--text-3)}

/* drawer */
.dr{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--surface);border-left:1px solid var(--border);
  z-index:210;transform:translateX(102%);transition:transform .26s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.dr.on{transform:none}
.dr-h{padding:18px 20px 14px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:10px}
.dr-h h3{margin:0;font-family:var(--fd);font-size:21px;font-weight:600}
.dr-b{flex:1;overflow:auto;padding:14px 16px 24px}

/* AI chat */
.chat{display:flex;flex-direction:column;gap:12px}
.bub{max-width:82%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.bub.ai{background:var(--purple-t);color:var(--text);border-bottom-left-radius:5px}
.bub.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.askbar{display:flex;gap:9px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:9px 12px}
.askbar input{flex:1;border:0;outline:0;background:none;font-size:14px;color:var(--text);font-family:inherit}

/* misc */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,120%);background:#241F17;color:#F5EFE2;padding:11px 18px;border-radius:12px;
  font-size:13px;font-weight:600;z-index:300;transition:transform .3s cubic-bezier(.2,.9,.3,1);box-shadow:var(--shadow-lg);max-width:90vw}
.toast.on{transform:translate(-50%,0)}
.empty{padding:34px;text-align:center;color:var(--text-3);font-size:13px}
.ring-w{position:relative;width:78px;height:78px;flex:0 0 78px}
.ring-w b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-size:22px;font-weight:600}
.hl{background:linear-gradient(180deg,transparent 62%,var(--gold-champ) 62%)}
.mini{font-size:11.5px;color:var(--text-3)}
.stack{display:flex;flex-direction:column;gap:14px}
.flexr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero{border-radius:var(--r);overflow:hidden;position:relative;padding:22px;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(135deg,#1B4B8F,#2E7CC4 55%,#57A9D8)}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 85% 12%,rgba(255,255,255,.28),transparent 60%)}
.hero .z{position:relative;z-index:2}
.hero .lb{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.85}
.hero h3{margin:6px 0 2px;font-family:var(--fd);font-size:27px;font-weight:600}
.hero p{margin:0;font-size:13px;opacity:.9}
.scorebar{display:flex;flex-direction:column;gap:9px}
.scorebar .l{display:flex;align-items:center;gap:10px;font-size:12.5px}
.scorebar .l b{flex:0 0 96px;font-weight:600;color:var(--text-2)}
.scorebar .l .bar{flex:1}
.scorebar .l i.v{flex:0 0 30px;text-align:right;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}

/* ikon dalam kotak .ic di luar .card-h — jaga agar tidak melar */
.ic>svg{width:55%;height:55%;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kpi{display:flex;gap:12px;align-items:center;min-width:0}
.kpi b{font-family:var(--fd);font-size:24px;font-weight:600;line-height:1.05;display:block}
.kpi span{font-size:11.5px;color:var(--text-3);display:block;margin-top:2px}

/* ---- papan proyek (kanban) & beban tim ---- */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(238px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px;margin:0}
.kan-col{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--r);padding:12px;min-width:0}
.kan-hd{display:flex;gap:8px;align-items:center;margin-bottom:11px}
.kan-hd b{font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--text-2)}
.kan-c{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:9px;cursor:pointer;transition:.15s}
.kan-c:hover{border-color:var(--gold-line);box-shadow:var(--shadow)}
.kan-c .kn{font-size:13.5px;font-weight:600;line-height:1.35;display:block}
.kan-c .km{font-size:11px;color:var(--text-3);display:block;margin-top:3px}
.kan-e{font-size:11.5px;color:var(--text-3);text-align:center;padding:14px 6px}
/* ---- papan geser (drag & drop) ---- */
.kan{scroll-behavior:smooth;overscroll-behavior-x:contain}
.kan-c{position:relative}
.kan-c:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.kan-mv{position:absolute;top:6px;right:6px;width:25px;height:25px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-3);display:none;place-items:center;cursor:pointer;padding:0;font:inherit;font-size:11px;line-height:1}
.kan-mv:hover{border-color:var(--gold-line);color:var(--gold-dark)}
.kan-c:hover .kan-mv,.kan-c:focus-within .kan-mv{display:grid}
@media (hover:none){.kan-mv{display:grid}}
.kan-ghost{position:fixed;z-index:940;margin:0;pointer-events:none;box-shadow:var(--shadow-lg);transform:rotate(1.4deg);opacity:.97;border-color:var(--gold-line);background:var(--surface)}
.kan-src{opacity:.3;filter:grayscale(.45)}
body.kan-dragging{user-select:none;-webkit-user-select:none}
body.kan-dragging .kan-c{cursor:grabbing}
.kan-col.kan-over{border-color:var(--gold);background:var(--gold-tint)}
.kan-slot{border:1.5px dashed var(--gold-line);border-radius:12px;min-height:46px;margin-bottom:9px;display:grid;place-items:center;font-size:11px;color:var(--gold-dark);background:var(--gold-tint)}
.kan-c.kan-pend{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-tint)}
.kan-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:930;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:9px 11px;display:none;gap:9px;align-items:center;font-size:12.5px;max-width:calc(100vw - 22px)}
.kan-bar.on{display:flex}
.kan-bar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kan-hint{font-size:11.5px;color:var(--text-3);margin:0 0 11px;line-height:1.75}
.kan-hint svg{width:13px;height:13px;display:inline-block;vertical-align:-2px;margin-right:4px}
.kan-hint kbd{margin:0 1px}
/* ---- penanda sinkronisasi ---- */
.cloudchip{position:fixed;right:14px;bottom:14px;z-index:920;display:flex;gap:6px;align-items:center;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);border-radius:999px;
  padding:6px 12px 6px 9px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.cloudchip:hover{border-color:var(--gold-line)}
.cloudchip .ci{width:13px;height:13px;display:grid;place-items:center;flex:0 0 13px}
.cloudchip .ci svg{width:100%;height:100%}
.cloudchip.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 30%,var(--border))}
.cloudchip.warn{color:var(--orange);border-color:color-mix(in srgb,var(--orange) 40%,var(--border));background:var(--orange-t)}
.cloudchip.idle{color:var(--text-3)}
@media (max-width:720px){.cloudchip{bottom:10px;right:10px;font-size:11px;padding:5px 10px 5px 8px}}
.kan-hint kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 4px;font:inherit;font-size:10.5px;background:var(--surface-2)}
.wl{display:flex;gap:11px;align-items:center;padding:10px 8px;border-radius:10px;min-width:0}
.wl:hover{background:var(--surface-2)}
.wl .wn{flex:0 0 150px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600}
.wl .wb{flex:1;display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--surface-3);min-width:60px}
.wl .wb i{display:block;height:100%}
.wl .wv{flex:0 0 96px;text-align:right;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
@media(max-width:720px){.wl .wn{flex:0 0 100px}.wl .wv{flex:0 0 66px}}

/* ---- my day: alat kerja harian ---- */
.chk{width:19px;height:19px;border-radius:6px;border:1.8px solid var(--border);display:grid;place-items:center;cursor:pointer;
  flex:0 0 19px;background:var(--surface);transition:.14s;margin-top:1px;color:transparent}
.chk:hover{border-color:var(--green)}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.chk svg{width:12px;height:12px;stroke-width:3}
.tline{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-radius:10px;transition:.14s;min-width:0}
.tline:hover{background:var(--surface-2)}
.tt{font-size:13.5px;font-weight:600;display:block;cursor:pointer;line-height:1.35}
.ts{font-size:11.5px;color:var(--text-3);display:block;margin-top:2px;line-height:1.45}
.tline.done .tt{text-decoration:line-through;color:var(--text-3);font-weight:500}
.tline .ta{margin-left:auto;flex:0 0 auto;display:flex;gap:5px;align-items:center;opacity:0;transition:.14s}
.tline:hover .ta,.tline:focus-within .ta{opacity:1}
@media(hover:none){.tline .ta{opacity:1}}
.datenav{display:flex;gap:4px;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px}
.datenav button{border:0;background:none;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;color:var(--text-2);
  padding:5px 11px;border-radius:8px;transition:.14s;white-space:nowrap}
.datenav button:hover{background:var(--surface);color:var(--gold-dark)}
.datenav button.nowd{color:var(--text);font-weight:700}
.prio{display:flex;gap:12px;align-items:flex-start;padding:13px;border-radius:12px;margin-bottom:9px;border:1px solid var(--border-soft)}
.prio .num{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;flex:0 0 26px}
.prio.done{opacity:.55}
.prio.done .tt{text-decoration:line-through}
.hist{display:flex;gap:6px;align-items:flex-end;height:52px}
.hist>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0}
.hist i{display:block;width:100%;max-width:54px;border-radius:5px;transition:.2s}
.hist span{font-size:9.5px;color:var(--text-3);white-space:nowrap}
.hist>div:hover i{filter:brightness(1.12)}

/* ---- form entry engine ---- */
.frm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:11.5px;font-weight:700;color:var(--text-2);letter-spacing:.2px;display:flex;gap:5px;align-items:center}
.fld label i{font-style:normal;color:var(--red);font-weight:800}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:10px;padding:9px 11px;font-size:13.5px;font-family:inherit;outline:0;transition:.15s;min-width:0}
.fld textarea{resize:vertical;min-height:74px;line-height:1.55}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-tint)}
.fld input::placeholder,.fld textarea::placeholder{color:var(--text-3)}
.fld select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 51%,calc(100% - 11px) 51%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.fld .fhint{font-size:11px;color:var(--text-3);line-height:1.45}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--red);background:var(--red-t)}
.ferr{font-size:11px;color:var(--red);font-weight:600}
.fgroup{grid-column:1/-1;font-size:10.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--text-3);
  border-top:1px solid var(--border-soft);padding-top:14px;margin-top:2px}
.fgroup:first-child{border-top:0;padding-top:0;margin-top:0}
.rec-row{display:flex;gap:11px;align-items:flex-start;padding:9px 8px;border-radius:10px;cursor:pointer;transition:.14s;min-width:0}
.rec-row:hover{background:var(--surface-2)}
.rec-row .rt{font-size:13px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-row .rs{font-size:11.5px;color:var(--text-3);display:block;margin-top:1px}
.rec-row .rd{margin-left:auto;flex:0 0 auto;display:flex;gap:5px;align-items:center}
.mine{border-left:3px solid var(--green)}
.csvbox{width:100%;min-height:190px;border:1px solid var(--border);border-radius:10px;padding:11px;font-family:ui-monospace,Menlo,monospace;
  font-size:11.5px;line-height:1.6;background:var(--surface-2);color:var(--text);resize:vertical;outline:0}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:7px;
  background:var(--surface-3);color:var(--text-2);font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}

@media(max-width:1240px){ .g4,.g.gsched{grid-template-columns:repeat(2,minmax(0,1fr))} }

}

/* ---- charts (inline SVG, no libs) ---- */
function spark(data,color,w=104,h=34,fill=true){
  const mn=Math.min(...data), mx=Math.max(...data), r=(mx-mn)||1;
  const pts=data.map((v,i)=>[i/(data.length-1)*w, h-4-((v-mn)/r)*(h-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const id='g'+Math.random().toString(36).slice(2,8);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;overflow:visible" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${CV(color)}" stop-opacity=".26"/><stop offset="1" stop-color="${CV(color)}" stop-opacity="0"/></linearGradient></defs>
    ${fill?`<path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/>`:''}
    <path d="${d}" fill="none" stroke="${CV(color)}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.6" fill="${CV(color)}"/></svg>`;
}
function ring(pct,color,size=78,sw=8,label){
  const r=(size-sw)/2, c=2*Math.PI*r;
  return `<div class="ring-w" style="width:${size}px;height:${size}px;flex-basis:${size}px">
   <svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${CV(color)}" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" style="transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.3,1)"/>
   </svg><b>${label!==undefined?label:pct}</b></div>`;
}
function bars(data,color,h=64,labels){
  const mx=Math.max(...data)||1;
  return `<div style="display:flex;align-items:flex-end;gap:5px;height:${h}px">${data.map((v,i)=>
    `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px" title="${v}">
      <div style="height:${Math.max(4,v/mx*(h-14))}px;background:${CV(color)};border-radius:5px;opacity:${.42+.58*(v/mx)}"></div>
      ${labels?`<span style="font-size:9px;color:var(--text-3);text-align:center">${labels[i]}</span>`:''}
    </div>`).join('')}</div>`;
}
function donut(items,size=124){
  const tot=items.reduce((s,i)=>s+i.v,0)||1; let a=0; const r=size/2-9, cx=size/2;
  const segs=items.map(it=>{
    const frac=it.v/tot, s=a*2*Math.PI-Math.PI/2; a+=frac; const e=a*2*Math.PI-Math.PI/2;
    const lg=frac>.5?1:0;
    const d=`M ${cx+r*Math.cos(s)} ${cx+r*Math.sin(s)} A ${r} ${r} 0 ${lg} 1 ${cx+r*Math.cos(e)} ${cx+r*Math.sin(e)}`;
    return `<path d="${d}" fill="none" stroke="${CV(it.c)}" stroke-width="16" stroke-linecap="butt"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex:0 0 ${size}px">${segs}</svg>`;
}
const barLine = (label,v,mx,color) => `<div class="l"><b>${label}</b><div class="bar"><i style="width:${Math.min(100,v/mx*100)}%;background:${CV(color)}"></i></div><i class="v">${v}</i></div>`;

/* ================================================================
   FORM ENTRY ENGINE — entri, ubah, arsip, pulihkan, ekspor
   Semua record buatan pengguna: is_dummy = false, source_type = MANUAL_ENTRY.
   Disimpan di penyimpanan browser (localStorage) — bertahan saat halaman dibuka ulang.
   Tidak pernah menyentuh folder atau berkas asli di Google Drive.
   ================================================================ */

const STORE_KEY = 'ajios-data';
let STORE = { v:1, seq:{}, rec:{}, log:[] };
try{
  const s = localStorage.getItem(STORE_KEY);
  if(s){ const o = JSON.parse(s); if(o && o.rec){ STORE = Object.assign({v:1,seq:{},rec:{},log:[]}, o); } }
}catch(e){}
function saveStore(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(STORE)); return true; }
  catch(e){ toast('Penyimpanan browser penuh — ekspor CSV lalu arsipkan record lama'); return false; }
}
const allRecs = t => STORE.rec[t] || [];
const recs    = t => allRecs(t).filter(r => !r._m.is_archived);
const arcRecs = t => allRecs(t).filter(r =>  r._m.is_archived);
const recById = id => { const t = String(id).split('-')[0]; return allRecs(t).find(r => r.id === id); };
/* Kode entitas selalu dibaca dari awalan ID, bukan dari properti .type.
   Sebagian entitas (Unit Bisnis, Organisasi, Acara) punya kolom isian
   bernama "type" sendiri — "Jenis usaha", "Jenis" — yang akan menimpa
   kode entitas kalau dibaca langsung. Awalan ID tidak pernah bisa tertimpa. */
const typeOf = r => (r && r.id) ? String(r.id).split('-')[0] : '';
function nextId(t){ STORE.seq[t] = (STORE.seq[t]||0) + 1; return t + '-' + String(STORE.seq[t]).padStart(6,'0'); }
function logAct(act, r, note, changes){
  const T = typeOf(r);
  const e = { ts:new Date().toISOString(), act, id:r.id, type:T, label:SCHEMA[T]?SCHEMA[T].t(r):'', note:note||'' };
  if(changes && changes.length) e.ch = changes;
  STORE.log.unshift(e);
  if(STORE.log.length > 600) STORE.log.length = 600;
}
/* Bandingkan record sebelum dan sesudah — dipakai linimasa per record */
function diffRec(before, after, type){
  const S = SCHEMA[type]; if(!S) return [];
  const out = [];
  S.f.filter(x => !x.g).forEach(x => {
    const a = before[x.k] === undefined ? '' : String(before[x.k]);
    const b = after[x.k]  === undefined ? '' : String(after[x.k]);
    if(a !== b) out.push({ k:x.k, l:x.l, from:a, to:b });
  });
  if(before._priv !== undefined && before._priv !== after._priv)
    out.push({ k:'_priv', l:'Tingkat privasi', from:before._priv, to:after._priv });
  return out;
}

let FORM_T = null, FORM_ID = null, FORM_SRC = '';

function fieldHTML(f, v, err){
  const val = v === undefined || v === null ? '' : String(v);
  const bad = err ? ' bad' : '';
  const lab = `<label>${h(f.l)}${f.req?'<i title="Wajib diisi">*</i>':''}</label>`;
  const hint = f.hint ? `<span class="fhint">${h(f.hint)}</span>` : '';
  const e = err ? `<span class="ferr">${h(err)}</span>` : '';
  let inp = '';
  if(f.t === 'textarea'){
    inp = `<textarea data-k="${f.k}" placeholder="${h(f.ph||'')}">${h(val)}</textarea>`;
  } else if(f.t === 'sel'){
    inp = `<select data-k="${f.k}"><option value="">— pilih —</option>` +
      f.opt.map(o=>`<option value="${h(o)}"${val===o?' selected':''}>${h(o)}</option>`).join('') + `</select>`;
  } else if(f.t === 'rel'){
    const list = recs(f.rel);
    const S2 = SCHEMA[f.rel];
    inp = list.length
      ? `<select data-k="${f.k}"><option value="">— tidak ditautkan —</option>` +
        list.map(r=>`<option value="${r.id}"${val===r.id?' selected':''}>${h(S2.t(r))} · ${r.id}</option>`).join('') + `</select>`
      : `<select data-k="${f.k}" disabled><option value="">Belum ada ${h(S2.n)} — tambahkan dulu</option></select>`;
  } else {
    const type = f.t==='num'?'number' : f.t==='date'?'date' : f.t==='time'?'time' : f.t==='tel'?'tel' : f.t==='email'?'email' : f.t==='url'?'url' : 'text';
    inp = `<input data-k="${f.k}" type="${type}" value="${h(val)}" placeholder="${h(f.ph||'')}">`;
  }
  return `<div class="fld${f.full||f.t==='textarea'?' full':''}${bad}">${lab}${inp}${e}${hint}</div>`;
}

  const body = S.f.map(f => f.g
    ? `<div class="fgroup">${h(f.g)}</div>`

    <div class="fld"><label>Tag</label>
      <input data-k="_tags" type="text" value="${h(vals._tags||'')}" placeholder="dipisah koma">

/* pre  : nilai awal untuk record BARU (dipakai "Jadikan Praktik" / "Jadikan Bahan")
   srcId : record asal, disimpan ke _m.source_id supaya tautannya dua arah */
function openForm(type, id, pre, srcId){
  const S = SCHEMA[type]; if(!S) return;
  FORM_T = type; FORM_ID = id || null; FORM_SRC = (!id && srcId) ? srcId : '';
  const r = id ? recById(id) : null;
  const vals = {};
  if(r){ Object.keys(r).forEach(k=>{ if(k!=='_m'&&k!=='id'&&k!=='type') vals[k]=r[k]; });
         vals._priv = r._m.privacy_level; vals._tags = (r._m.tags||[]).join(', '); }
  else { const f0 = S.f.find(x=>x.k==='date'); if(f0) vals.date = new Date().toISOString().slice(0,10);
         if(pre) Object.keys(pre).forEach(k => { if(pre[k]) vals[k] = pre[k]; }); }
  modal(
    (r ? 'Ubah ' : 'Tambah ') + S.n,
    r ? `${r.id} · dibuat ${dtID(r._m.created_at)}` : `${S.d} Setiap record baru otomatis mendapat ID global, metadata universal, dan tingkat privasi.`,
    `<form id="formFields" class="frm" onsubmit="return false">${fieldsHTML(type, vals, {})}</form>`,
    `<button class="btn solid" onclick="submitForm()">${ic('check')} ${r?'Simpan perubahan':'Simpan'}</button>
     <button class="btn ghost" onclick="closeModal()">Batal</button>
     ${r?`<button class="btn red" style="margin-left:auto" onclick="archiveRec('${r.id}')">Arsipkan</button>`:
        `<span class="mini" style="margin-left:auto;align-self:center">ID berikutnya · ${type}-${String((STORE.seq[type]||0)+1).padStart(6,'0')}</span>`}`,
    true);
}

function collectForm(){
  const o = {};
  document.querySelectorAll('#formFields [data-k]').forEach(el => { o[el.dataset.k] = (el.value||'').trim(); });
  return o;
}

function submitForm(){
  const type = FORM_T, S = SCHEMA[type]; if(!S) return;
  const v = collectForm(), errs = {};
  S.f.forEach(f => {
    if(f.g) return;
    const val = v[f.k] || '';
    if(f.req && !val) errs[f.k] = 'Wajib diisi';
    else if(val && f.t === 'num' && isNaN(Number(val))) errs[f.k] = 'Harus berupa angka';
    else if(val && f.t === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val)) errs[f.k] = 'Format email belum benar';
  });
  if(v.start && v.end && v.end < v.start) errs.end = 'Lebih awal dari tanggal mulai';
  if(v.start && v.due && v.due < v.start) errs.due = 'Lebih awal dari tanggal mulai';
  if(Object.keys(errs).length){
    const vals = Object.assign({}, v);
    document.getElementById('formFields').innerHTML = fieldsHTML(type, vals, errs);
    const first = document.querySelector('#formFields .fld.bad');
    if(first) first.scrollIntoView({block:'center', behavior:'smooth'});
    toast(Object.keys(errs).length + ' isian perlu diperbaiki');
    return;
  }
  const now = new Date().toISOString();
  const tags = (v._tags||'').split(',').map(s=>s.trim()).filter(Boolean);
  const priv = v._priv || S.priv;
  delete v._tags; delete v._priv;
  let r;
  if(FORM_ID){
    r = recById(FORM_ID); if(!r){ closeModal(); return; }
    const before = Object.assign({}, r, { _priv: r._m.privacy_level });
    Object.assign(r, v);
    r._m.updated_at = now; r._m.updated_by = DB.owner.name;
    r._m.privacy_level = priv; r._m.tags = tags;
    logAct('UPDATE', r, '', diffRec(before, Object.assign({}, r, { _priv: priv }), type));
  } else {
    r = Object.assign({ id: nextId(type), type }, v);
    r._m = { created_at:now, updated_at:now, created_by:DB.owner.name, updated_by:DB.owner.name,
             status:'ACTIVE', source_type: FORM_SRC ? 'DERIVED' : 'MANUAL_ENTRY',
             source_id: FORM_SRC || '', source_url:'',
             privacy_level:priv, is_dummy:false, is_archived:false, tags };
    (STORE.rec[type] = STORE.rec[type] || []).unshift(r);
    logAct('CREATE', r, FORM_SRC ? ('Dibuat dari ' + FORM_SRC) : '');
  }
  /* cap sumber: dipakai untuk menandai "Sumber diperbarui — tinjau kembali" */
  if(typeof npTakeSnap === 'function' && type === 'BHN') npTakeSnap(r);
  FORM_SRC = '';
  saveStore(); closeModal();
  toast(`${S.n} tersimpan — ${r.id} · is_dummy = false`);
  go(CUR);
}

function archiveRec(id){
  const r = recById(id); if(!r) return;
  r._m.is_archived = true; r._m.status = 'ARCHIVED'; r._m.updated_at = new Date().toISOString();

  toast('Diarsipkan — tidak hilang, bisa dipulihkan di System Foundation › Data Saya');

}
function restoreRec(id){
  const r = recById(id); if(!r) return;
  r._m.is_archived = false; r._m.status = 'ACTIVE'; r._m.updated_at = new Date().toISOString();

/* ================= EKSPOR CSV ================= */
function csvOf(type){
  const S = SCHEMA[type], keys = S.f.filter(f=>!f.g).map(f=>f.k);
  const head = ['id'].concat(keys, ['privacy_level','tags','created_at','updated_at','is_dummy','is_archived']);
  const q = s => '"' + String(s===undefined||s===null?'':s).replace(/"/g,'""') + '"';
  const lines = [head.map(q).join(',')];
  allRecs(type).forEach(r=>{
    lines.push([q(r.id)].concat(
      keys.map(k=>q(r[k])),
      [q(r._m.privacy_level), q((r._m.tags||[]).join('; ')), q(r._m.created_at), q(r._m.updated_at), q(r._m.is_dummy), q(r._m.is_archived)]
    ).join(','));
  });
  return lines.join('\n');
}
function exportCSV(type){
  const S = SCHEMA[type], n = allRecs(type).length;
  if(!n){ toast('Belum ada record ' + S.n + ' untuk diekspor'); return; }
  modal('Ekspor ' + S.n, `${n} record · format CSV, siap ditempel ke template Google Sheets di folder modul.`,
    `<p class="sub" style="margin-bottom:12px">Salin seluruh isi kotak di bawah, lalu di Google Sheets pilih <b>Tempel</b> pada sel A1. Kolom sudah cocok dengan Data Dictionary.</p>
     <textarea class="csvbox" id="csvOut" readonly>${h(csvOf(type))}</textarea>`,
    `<button class="btn solid" onclick="copyCSV()">${ic('doc')} Salin ke papan klip</button>
     <button class="btn ghost" onclick="closeModal()">Tutup</button>`, true);
}
function copyCSV(){
  const el = document.getElementById('csvOut'); if(!el) return;
  el.focus(); el.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(el.value).then(()=>toast('Tersalin')).catch(()=>toast('Salin manual: Ctrl/Cmd + C')); return; }
  toast(ok ? 'Tersalin ke papan klip' : 'Salin manual: Ctrl/Cmd + C');
}

      </div>`).join('')}</div></div>` : ''}
  `;
};

/* ================================================================
   MY DAY — ALAT KERJA HARIAN
   Berjalan di atas record asli: LOG (check-in), TSK (tugas), MTG (agenda).
   Tugas yang lewat tenggat terbawa otomatis ke hari berjalan.
   ================================================================ */

const isoOf = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const todayISO = () => isoOf(new Date());
const shiftISO = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoOf(d); };
const daysBetween = (a, b) => Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 86400000);
function fmtDay(iso){
  const d = new Date(iso + 'T12:00:00');
  return `${HARI[d.getDay()]}, ${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
}
function relDay(iso){
  const n = daysBetween(todayISO(), iso);
  return n===0 ? 'Hari ini' : n===1 ? 'Besok' : n===-1 ? 'Kemarin' : n>0 ? n+' hari lagi' : Math.abs(n)+' hari lalu';
}

let MD_DATE = todayISO();
function mdGo(iso){ MD_DATE = iso; go('myday'); }
function mdShift(n){ mdGo(shiftISO(MD_DATE, n)); }

/* ---------------- kueri ---------------- */
const DONE_ST = ['Selesai','Dibatalkan'];
const logFor   = d => recs('LOG').find(r => r.date === d);
const openTsk  = () => recs('TSK').filter(t => DONE_ST.indexOf(t.status) < 0);
const carryTsk = d => openTsk().filter(t => t.due && t.due <  d).sort((a,b)=> a.due < b.due ? -1 : 1);
const dueTsk   = d => openTsk().filter(t => t.due === d);
const someday  = () => openTsk().filter(t => !t.due);
const doneTsk  = d => recs('TSK').filter(t => t.status === 'Selesai' && t.done === d);
const mtgFor   = d => recs('MTG').filter(m => m.date === d).sort((a,b)=> (a.time||'99') < (b.time||'99') ? -1 : 1);
/* Tiga prioritas: P1 dulu, lalu yang terlambat paling lama, lalu jatuh tempo hari ini */
function top3(d){
  const pool = carryTsk(d).concat(dueTsk(d), someday().filter(t => t.pri && t.pri.indexOf('P1') === 0));
  const seen = {}, out = [];
  pool.forEach(t => { if(!seen[t.id]){ seen[t.id] = 1; out.push(t); } });
  out.sort((a,b) => {
    const p = x => x.pri ? Number(x.pri[1]) || 9 : 9;
    if(p(a) !== p(b)) return p(a) - p(b);
    return (a.due || '9999') < (b.due || '9999') ? -1 : 1;
  });
  return out.slice(0,3);
}

/* ---------------- aksi ---------------- */
function taskDone(id){
  const t = recById(id); if(!t) return;
  const st0 = t.status;
  t.status = 'Selesai'; t.done = MD_DATE;
  t._m.updated_at = new Date().toISOString(); t._m.updated_by = DB.owner.name;
  logAct('DONE', t, '', [{k:'status',l:'Status',from:st0,to:t.status},{k:'done',l:'Tanggal selesai',from:'',to:t.done}]); saveStore(); toast('Selesai — ' + SCHEMA.TSK.t(t)); go(CUR);
}
function taskUndone(id){
  const t = recById(id); if(!t) return;
  t.status = 'Sedang dikerjakan'; t.done = '';
  t._m.updated_at = new Date().toISOString();
  logAct('REOPEN', t, '', [{k:'status',l:'Status',from:'Selesai',to:t.status}]); saveStore(); go(CUR);
}
function taskMove(id, iso){
  const t = recById(id); if(!t) return;
  const from = t.due || '(tanpa tenggat)';
  t.due = iso; t._m.updated_at = new Date().toISOString();
  logAct('RESCHEDULE', t, '', [{k:'due',l:'Jatuh tempo',from:from,to:iso}]); saveStore();
  toast('Dipindah ke ' + relDay(iso).toLowerCase()); go(CUR);
}
function carryAll(){
  const list = carryTsk(MD_DATE); if(!list.length) return;
  list.forEach(t => { t.due = MD_DATE; t._m.updated_at = new Date().toISOString(); logAct('RESCHEDULE', t, 'carry-over'); });
  saveStore(); toast(list.length + ' tugas terbawa ditarik ke ' + relDay(MD_DATE).toLowerCase()); go(CUR);
}

/* ---------------- potongan tampilan ---------------- */
function taskLine(t, d){
  const done = t.status === 'Selesai';
  const late = !done && t.due && t.due < d ? daysBetween(t.due, d) : 0;
  const owner = t.owner ? recById(t.owner) : null;
  const sub = [
    late ? `<b style="color:var(--red)">terlambat ${late} hari</b>` : (t.due ? 'tenggat ' + relDay(t.due).toLowerCase() : 'tanpa tenggat'),
    t.pri ? h(t.pri) : '', owner ? h(SCHEMA.PER.t(owner)) : '', t.est ? h(t.est) + ' menit' : ''
  ].filter(Boolean).join(' · ');
  return `<div class="tline ${done?'done':''}">
    <span class="chk ${done?'on':''}" role="checkbox" tabindex="0" aria-checked="${done}"
      onclick="${done?`taskUndone('${t.id}')`:`taskDone('${t.id}')`}"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}">${ic('check')}</span>
    <span style="min-width:0;flex:1" onclick="recDetail('${t.id}')">
      <span class="tt">${h(SCHEMA.TSK.t(t))}</span><span class="ts">${sub}</span></span>

      ${!done && t.due !== d ? `<button class="btn ghost sm" onclick="taskMove('${t.id}','${d}')" title="Tarik ke hari ini">Hari ini</button>` : ''}
      ${!done ? `<button class="btn ghost sm" onclick="taskMove('${t.id}','${shiftISO(d,1)}')" title="Tunda ke besok">Besok</button>` : ''}
    </span></div>`;
}

/* ================================================================
   IMPOR CSV / GOOGLE SHEETS — jembatan dari template Drive ke OS
   Tempel → cocokkan kolom → pratinjau → setujui.
   Baris dengan kolom id yang cocok memperbarui record lama (bukan duplikat).
   Tidak pernah menyentuh berkas asli di Drive — hanya membaca teks yang Anda tempel.
   ================================================================ */

/* ---------------- parser tabel (CSV & TSV, sadar tanda kutip) ---------------- */
function parseTable(text){
  const t = String(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  if(!t.trim()) return [];
  const firstLine = t.split('\n')[0];
  const delim = firstLine.indexOf('\t') >= 0 ? '\t' : (firstLine.indexOf(';') >= 0 && firstLine.indexOf(',') < 0 ? ';' : ',');
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){
      if(c === '"'){ if(t[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else {
      if(c === '"') q = true;
      else if(c === delim){ row.push(cell); cell = ''; }
      else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
  }
  row.push(cell); rows.push(row);
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x !== ''));
}

/* ---------------- normalisasi nilai ---------------- */
const normKey = s => String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
function mkDate(y,m,d){
  y=Number(y); m=Number(m); d=Number(d);
  const dt = new Date(Date.UTC(y,m-1,d));
  if(dt.getUTCFullYear()!==y || dt.getUTCMonth()!==m-1 || dt.getUTCDate()!==d) return null;
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function normDate(v){
  v = String(v).trim(); if(!v) return '';
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);            /* yyyy-mm-dd */
  if(m) return mkDate(m[1], m[2], m[3]);
  m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);   /* dd/mm/yyyy */
  if(m) return mkDate(m[3], m[2], m[1]);
  m = v.match(/^(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})$/);        /* 3 Sep 2026 */
  if(m){
    const i = BLN.findIndex(b => b.toLowerCase().slice(0,3) === m[2].toLowerCase().slice(0,3));
    if(i >= 0) return mkDate(m[3], i+1, m[1]);
  }
  return null;
}
/* Angka gaya Indonesia: titik = pemisah ribuan, koma = desimal.
   "1.250,50" → 1250.50 · "12.000" → 12000 · "1250.50" → 1250.50 */
function normNum(v){
  let s = String(v).replace(/rp/ig,'').replace(/\s/g,'').replace(/(jt|juta|m)$/i,'');
  if(/,\d{1,2}$/.test(s)) return s.replace(/\./g,'').replace(',','.');
  if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) return s.replace(/\./g,'');
  return s.replace(/,/g,'');
}

/* ---------------- langkah 2 → 3 ---------------- */
function impParse(){
  const el = document.getElementById('impIn');
  IMP.raw = el ? el.value : '';
  const rows = parseTable(IMP.raw);
  if(rows.length < 2){ toast('Belum ada data terbaca — pastikan baris judul dan minimal satu baris isi ikut tersalin'); return; }
  IMP.head = rows[0];
  IMP.body = rows.slice(1);
  impAutoMap();
  IMP.step = 3; impRender();
}
function impAutoMap(){
  const S = SCHEMA[IMP.type], fields = S.f.filter(f => !f.g);
  IMP.map = {};
  IMP.head.forEach((c, i) => {
    const n = normKey(c);
    if(!n) return;
    if(META_COLS[n]){ IMP.map[String(i)] = META_COLS[n]; return; }
    let f = fields.find(x => normKey(x.k) === n) || fields.find(x => normKey(x.l) === n);
    if(!f) f = fields.find(x => normKey(x.l).indexOf(n) === 0 || n.indexOf(normKey(x.l)) === 0);
    if(f) IMP.map[String(i)] = f.k;
  });
}

/* ---------------- langkah 3 → 4 ---------------- */
function impValidate(){
  const S = SCHEMA[IMP.type], fields = S.f.filter(f => !f.g);
  const byKey = {}; fields.forEach(f => byKey[f.k] = f);
  const rows = []; let skipped = 0;

  IMP.body.forEach((r, idx) => {
    const first = String(r[0] || '').toUpperCase();
    if(first.indexOf('CONTOH') === 0 || first.indexOf('PANDUAN') === 0 || r.every(c => !c)){ skipped++; return; }

    const vals = {}, msgs = []; let st = 'ok', upd = '';
    Object.keys(IMP.map).forEach(ci => {
      const key = IMP.map[ci]; if(!key) return;
      let v = String(r[Number(ci)] || '').trim(); if(!v) return;

      if(key === 'id'){
        const ex = recById(v);
        if(ex && ex.type === IMP.type) upd = v;
        else msgs.push('ID ' + v + ' tidak ditemukan — dibuat sebagai record baru');
        return;
      }
      if(key === '_priv'){ vals._priv = PRIV.indexOf(v) >= 0 ? v : S.priv; return; }
      if(key === '_tags'){ vals._tags = v; return; }

      const f = byKey[key]; if(!f) return;
      if(f.t === 'date'){
        const d = normDate(v);
        if(d === null){ msgs.push(h(f.l) + ': tanggal "' + v + '" tidak terbaca'); st = 'warn'; return; }
        v = d;
      } else if(f.t === 'num'){
        const n = normNum(v);
        if(isNaN(Number(n))){ msgs.push(h(f.l) + ': "' + v + '" bukan angka'); st = 'warn'; return; }
        v = n;
      } else if(f.t === 'sel'){
        const hit = f.opt.find(o => normKey(o) === normKey(v));
        if(!hit){
          const other = f.opt.find(o => normKey(o) === 'lainnya');
          if(other){ msgs.push(h(f.l) + ': "' + v + '" tidak dikenal — disetel ke ' + other); v = other; }
          else { msgs.push(h(f.l) + ': "' + v + '" bukan pilihan yang dikenal'); st = 'warn'; return; }
          st = 'warn';
        } else v = hit;
      } else if(f.t === 'rel'){
        const ex = recById(v);
        if(!ex || typeOf(ex) !== f.rel){ msgs.push(h(f.l) + ': ' + v + ' bukan ID ' + SCHEMA[f.rel].n); st = 'warn'; return; }
      } else if(f.t === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){
        msgs.push('Email "' + v + '" tidak wajar'); st = 'warn';
      }
      vals[f.k] = v;
    });

    fields.filter(f => f.req).forEach(f => {
      if(!vals[f.k] && !upd){ msgs.push(h(f.l) + ' kosong'); st = 'error'; }
    });

    /* duplikat berdasarkan judul, hanya untuk record baru */
    if(!upd && st !== 'error'){
      const title = S.t(Object.assign({}, vals));
      const dup = recs(IMP.type).find(x => S.t(x) && title && normKey(S.t(x)) === normKey(title));
      if(dup){ msgs.push('Mirip dengan ' + dup.id + ' yang sudah ada'); if(st === 'ok') st = 'warn'; }
    }

    rows.push({ line: idx + 2, vals, msgs, st, upd, title: (()=>{ try{ return S.t(vals); }catch(e){ return ''; } })() });
  });

  IMP.res = { rows, skipped };
  IMP.step = 4; impRender();
}

/* ---------------- langkah 4: simpan ---------------- */
function impCommit(){
  const S = SCHEMA[IMP.type], now = new Date().toISOString();
  const ids = []; let created = 0, updated = 0;
  IMP.res.rows.filter(x => x.st !== 'error').forEach(x => {
    const v = Object.assign({}, x.vals);
    const tags = (v._tags || '').split(',').map(s => s.trim()).filter(Boolean);
    const priv = v._priv || S.priv;
    delete v._tags; delete v._priv;
    if(x.upd){
      const r = recById(x.upd);
      Object.assign(r, v);
      r._m.updated_at = now; r._m.updated_by = DB.owner.name;
      if(tags.length) r._m.tags = tags;
      r._m.privacy_level = priv;
      logAct('IMPORT-UPDATE', r); ids.push(r.id); updated++;
    } else {
      const r = Object.assign({ id: nextId(IMP.type), type: IMP.type }, v);
      r._m = { created_at:now, updated_at:now, created_by:DB.owner.name, updated_by:DB.owner.name,
               status:'ACTIVE', source_type:'IMPORT_CSV', source_id:'', source_url:'',
               privacy_level:priv, is_dummy:false, is_archived:false, tags };
      (STORE.rec[IMP.type] = STORE.rec[IMP.type] || []).unshift(r);
      logAct('IMPORT', r); ids.push(r.id); created++;
    }
  });
  STORE.imports = STORE.imports || [];
  STORE.imports.unshift({ id:'IMP-' + String(STORE.imports.length + 1).padStart(6,'0'), ts:now, type:IMP.type, created, updated, ids });
  saveStore(); closeModal();
  toast(`${created} record baru · ${updated} diperbarui — ${S.n}`);
  go(CUR);
}

/* ---------------- batalkan satu batch impor ---------------- */
function undoImport(id){
  const b = (STORE.imports || []).find(x => x.id === id); if(!b) return;
  modal('Batalkan impor ' + b.id, `${b.created} record baru dan ${b.updated} pembaruan dari ${dtID(b.ts)}.`,
    `<p class="sub">Record baru dari batch ini akan diarsipkan — ditandai <code>is_archived = true</code>, tidak dihapus, dan masih bisa dipulihkan satu per satu.</p>
     <p class="sub" style="margin-top:10px"><b>Yang tidak bisa dikembalikan:</b> ${b.updated} record lama yang diperbarui oleh impor ini tetap memakai nilai baru — nilai lamanya tidak disimpan.</p>`,
    `<button class="btn red" onclick="doUndoImport('${id}')">Arsipkan ${b.created} record baru</button>
     <button class="btn ghost" onclick="closeModal()">Batal</button>`);
}
function doUndoImport(id){
  const b = (STORE.imports || []).find(x => x.id === id); if(!b) return;
  let n = 0;
  b.ids.forEach(rid => {
    const r = recById(rid);
    if(r && r._m.source_type === 'IMPORT_CSV' && !r._m.is_archived){
      r._m.is_archived = true; r._m.status = 'ARCHIVED'; r._m.updated_at = new Date().toISOString();
      logAct('ARCHIVE', r, 'undo ' + id); n++;
    }
  });
  b.undone = true; saveStore(); closeModal();
  toast(n + ' record dari ' + id + ' diarsipkan'); go(CUR);
}

/* ================================================================
   TASK & PROJECT ENGINE
   Papan tugas berfilter · papan proyek · milestone · beban tim.
   Progres proyek dihitung dari tugas yang selesai, bukan diketik manual.

/* ---------------- entitas baru: Milestone ---------------- */
SCHEMA.MLS = {
  n:'Milestone', ic:'flag', c:'orange', mod:'projects', priv:'TEAM',
  d:'Titik capai di dalam proyek — dengan tanggal dan status.',
  t:r=>r.n, s:r=>{ const p = r.proj ? recById(r.proj) : null;
    return [p?SCHEMA.PRO.t(p):'tanpa proyek', r.date?dOnly(r.date):'', r.status].filter(Boolean).join(' · '); },
  f:[{k:'n',l:'Nama milestone',t:'text',req:1,full:1,ph:'Izin operasional terbit'},
     {k:'proj',l:'Proyek',t:'rel',rel:'PRO',req:1},
     {k:'date',l:'Tanggal target',t:'date',req:1},
     {k:'status',l:'Status',t:'sel',req:1,opt:['Belum tercapai','Tercapai','Terlewat','Dibatalkan']},
     {k:'owner',l:'Penanggung jawab',t:'rel',rel:'PER'},
     {k:'proof',l:'Bukti tercapai',t:'text',full:1,hint:'Apa yang membuktikan ini benar-benar selesai?'},
     {k:'note',l:'Catatan',t:'textarea',full:1}]
};
SCH_ORDER.splice(SCH_ORDER.indexOf('PRO') + 1, 0, 'MLS');
MODULE_ENTITIES.projects = ['PRO','TSK','MLS'];

/* ---------------- perhitungan ---------------- */
function projStats(p){
  const ts = recs('TSK').filter(t => t.proj === p.id);
  const done = ts.filter(t => t.status === 'Selesai').length;
  const late = ts.filter(t => t.status !== 'Selesai' && t.due && t.due < todayISO()).length;
  const ms = recs('MLS').filter(m => m.proj === p.id);
  return {
    n: ts.length, done, open: ts.length - done, late,
    pct: ts.length ? Math.round(done / ts.length * 100) : (Number(p.progress) || 0),
    auto: ts.length > 0,
    ms: ms.length, msDone: ms.filter(m => m.status === 'Tercapai').length,
    overdue: p.due && p.due < todayISO() && p.status !== 'Selesai' && p.status !== 'Dibatalkan'
  };
}
function ownerName(id){ const p = id ? recById(id) : null; return p ? SCHEMA.PER.t(p) : 'Belum ditugaskan'; }
function workload(){
  const open = openTsk();
  const map = {};
  open.forEach(t => { const k = t.owner || '_none'; (map[k] = map[k] || []).push(t); });
  recs('PER').forEach(p => { if(!map[p.id]) return; });
  return Object.keys(map).map(k => {
    const list = map[k];
    return {
      id: k, name: k === '_none' ? 'Belum ditugaskan' : ownerName(k),
      open: list.length,
      late: list.filter(t => t.due && t.due < todayISO()).length,
      p1: list.filter(t => t.pri && t.pri.indexOf('P1') === 0).length,
      done30: recs('TSK').filter(t => t.status === 'Selesai' && (t.owner || '_none') === k &&
                t.done && daysBetween(t.done, todayISO()) <= 30).length
    };
  }).sort((a,b) => b.open - a.open);
}

/* ---------------- state tampilan ---------------- */
let PJ_TAB = 'tasks';
let TF = { q:'', st:'open', owner:'', proj:'', pri:'', grp:'status' };

function pjTab(k){ PJ_TAB = k; go('projects'); }
function tfSet(k, v){ TF[k] = v; go('projects'); }

/* ---------------- daftar tugas berfilter ---------------- */
function tskFiltered(){
  const today = todayISO(), wk = shiftISO(today, 7);
  let list = recs('TSK');
  if(TF.st === 'open')      list = list.filter(t => DONE_ST.indexOf(t.status) < 0);
  else if(TF.st === 'late') list = list.filter(t => DONE_ST.indexOf(t.status) < 0 && t.due && t.due < today);
  else if(TF.st === 'today')list = list.filter(t => DONE_ST.indexOf(t.status) < 0 && t.due && t.due <= today);
  else if(TF.st === 'week') list = list.filter(t => DONE_ST.indexOf(t.status) < 0 && t.due && t.due <= wk);
  else if(TF.st === 'done') list = list.filter(t => t.status === 'Selesai');
  if(TF.owner) list = list.filter(t => (t.owner || '_none') === TF.owner);
  if(TF.proj)  list = list.filter(t => (t.proj  || '_none') === TF.proj);
  if(TF.pri)   list = list.filter(t => t.pri === TF.pri);
  if(TF.q){
    const q = TF.q.toLowerCase();
    list = list.filter(t => (t.n + ' ' + (t.note||'')).toLowerCase().includes(q));
  }
  return list;
}
function tskGroups(list){
  const today = todayISO();
  if(TF.grp === 'status') return ST_TASK.map(s => [s, list.filter(t => t.status === s)]);
  if(TF.grp === 'pri')    return ['P1 — hari ini','P2 — minggu ini','P3 — nanti'].map(p => [p, list.filter(t => t.pri === p)])
                                  .concat([['Tanpa prioritas', list.filter(t => !t.pri)]]);
  if(TF.grp === 'proj')   return recs('PRO').map(p => [SCHEMA.PRO.t(p), list.filter(t => t.proj === p.id)])
                                  .concat([['Tanpa proyek', list.filter(t => !t.proj)]]);
  if(TF.grp === 'owner'){
    /* setiap pemegang yang muncul di daftar ini — termasuk tugas yang sudah selesai */
    const keys = []; list.forEach(t => { const k = t.owner || '_none'; if(keys.indexOf(k) < 0) keys.push(k); });
    keys.sort((a,b) => a === '_none' ? 1 : b === '_none' ? -1 : 0);
    return keys.map(k => [k === '_none' ? 'Belum ditugaskan' : ownerName(k), list.filter(t => (t.owner || '_none') === k)]);
  }
  /* tenggat — tugas selesai tetap masuk kotak tanggalnya, tampil tercoret */
  return [
    ['Lewat tenggat',   list.filter(t => t.due && t.due <  today)],
    ['Hari ini',        list.filter(t => t.due === today)],
    ['7 hari ke depan', list.filter(t => t.due && t.due > today && t.due <= shiftISO(today,7))],
    ['Lebih jauh',      list.filter(t => t.due && t.due >  shiftISO(today,7))],

    <div class="chips" style="margin-bottom:10px">

      ${sel('proj',  [['_none','Tanpa proyek']].concat(recs('PRO').map(p=>[p.id, SCHEMA.PRO.t(p)])), 'Semua proyek')}

/* ---------------- ruang kerja satu proyek ---------------- */
function projWork(id){
  const p = recById(id); if(!p) return;
  const s = projStats(p);
  const ts = recs('TSK').filter(t => t.proj === id);
  const ms = recs('MLS').filter(m => m.proj === id).sort((a,b) => (a.date||'9') < (b.date||'9') ? -1 : 1);
  const today = todayISO();
  modal(SCHEMA.PRO.t(p), `${p.status} · ${s.done}/${s.n} tugas selesai${p.due ? ' · target ' + dOnly(p.due) : ''}`,
    `<div class="flexr" style="gap:7px;margin-bottom:16px">
       ${idPill(p.id)}
       <span class="pill ${p.status==='Selesai'?'green':p.status==='Tertahan'?'orange':'purple'}">${h(p.status)}</span>
       ${s.overdue ? '<span class="pill red">lewat target</span>' : ''}
       ${p.owner ? `<span class="pill gray">${h(ownerName(p.owner))}</span>` : ''}
     </div>

     <div class="flexr" style="gap:12px;margin-bottom:6px">
       <div style="flex:1"><div class="flexr" style="justify-content:space-between;margin-bottom:5px">
         <span class="mini">Progres ${s.auto ? '— dihitung dari tugas selesai' : '— diisi manual, belum ada tugas'}</span>
         <b>${s.pct}%</b></div>
         <div class="bar" style="height:9px"><i style="width:${s.pct}%;background:var(--purple)"></i></div></div>
     </div>
     ${p.goal ? `<p class="sub" style="margin:14px 0 0">${h(p.goal).replace(/\n/g,'<br>')}</p>` : ''}
     ${p.risk ? `<div class="statebar del" style="margin:14px 0 0"><span class="dbadge" style="background:var(--red)">RISIKO</span>
        <div style="flex:1;min-width:200px">${h(p.risk)}</div></div>` : ''}

     <div class="sep" style="margin:18px 0"></div>
     <div class="card-h"><div class="ic" style="background:var(--orange-t);color:var(--orange)">${ic('flag')}</div>
       <h3>Milestone</h3><div class="r"><button class="btn ghost sm" onclick="closeModal();openForm('MLS')">${ic('plus')} Milestone</button></div></div>
     ${ms.length ? `<div class="tl">${ms.map(m=>{
        const late = m.status === 'Belum tercapai' && m.date && m.date < today;
        const c = m.status === 'Tercapai' ? 'green' : late ? 'red' : m.status === 'Dibatalkan' ? 'gray' : 'orange';
        return `<div class="tl-i" onclick="closeModal();recDetail('${m.id}')">
          <span class="tm">${m.date ? dOnly(m.date).slice(0,6) : '—'}</span>
          <span class="bar" style="background:${CV(c)}"></span>
          <span class="bd"><b>${h(m.n)}</b><span>${h(m.status)}${late ? ' · terlambat ' + daysBetween(m.date, today) + ' hari' : ''}</span></span>
        </div>`; }).join('')}</div>`
      : '<p class="sub" style="margin:0">Belum ada milestone. Tanpa titik capai, proyek panjang sulit dinilai sedang di mana.</p>'}

     <div class="sep" style="margin:18px 0"></div>
     <div class="card-h"><div class="ic" style="background:var(--blue-t);color:var(--blue)">${ic('check')}</div>
       <h3>Tugas</h3><div class="r"><span class="cnt">${ts.length}</span>
       <button class="btn ghost sm" style="margin-left:8px" onclick="closeModal();TF={q:'',st:'all',owner:'',proj:'${id}',pri:'',grp:'status'};PJ_TAB='tasks';go('projects')">Buka di papan</button></div></div>
     ${ts.length ? ts.slice(0,12).map(t => taskLine(t, today)).join('')

     ${ts.length > 12 ? `<div class="mini" style="margin-top:8px">Menampilkan 12 dari ${ts.length}.</div>` : ''}`,
    `<button class="btn solid" onclick="closeModal();openForm('TSK')">${ic('plus')} Tugas baru</button>
     <button class="btn ghost" onclick="openForm('PRO','${id}')">Ubah proyek</button>
     <button class="btn ghost" onclick="closeModal()">Tutup</button>`, true);
}

function pjMilestones(){
  const all = recs('MLS').sort((a,b) => (a.date||'9') < (b.date||'9') ? -1 : 1);
  const today = todayISO();
  if(!all.length) return `<div class="card" style="text-align:center;padding:42px 26px">
    <div style="width:56px;height:56px;border-radius:17px;background:var(--orange-t);color:var(--orange);display:grid;place-items:center;margin:0 auto 15px">

  const late = all.filter(m => m.status === 'Belum tercapai' && m.date && m.date < today);
  const soon = all.filter(m => m.status === 'Belum tercapai' && m.date && m.date >= today && m.date <= shiftISO(today,30));
  const grp = [['Terlambat', late, 'red'], ['30 hari ke depan', soon, 'orange'],
               ['Tercapai', all.filter(m => m.status === 'Tercapai'), 'green'],
               ['Lainnya', all.filter(m => late.indexOf(m)<0 && soon.indexOf(m)<0 && m.status !== 'Tercapai'), 'gray']];
  return `
  <div class="card">
    ${cardH('flag','Milestone','orange',`<button class="btn gold sm" onclick="openForm('MLS')">${ic('plus')} Milestone</button>`)}
    ${grp.filter(g => g[1].length).map(g => `
      <div style="margin-bottom:16px">
        <div class="flexr" style="gap:8px;margin:0 0 6px">

          <span class="cnt">${g[1].length}</span></div>

          return `<div class="row-i" style="align-items:flex-start" onclick="recDetail('${m.id}')">
            <span style="width:8px;height:8px;border-radius:50%;background:${CV(g[2])};margin-top:6px;flex:0 0 8px"></span>

              <span class="s">${p ? h(SCHEMA.PRO.t(p)) : 'tanpa proyek'} · ${m.date ? dOnly(m.date) : '—'}${m.owner ? ' · ' + h(ownerName(m.owner)) : ''}</span></span>
            <span class="rt"><span class="pill ${g[2]}">${m.date ? relDay(m.date) : '—'}</span></span></div>`; }).join('')}</div>
      </div>`).join('')}
  </div>`;
}

const CADENCE_DAYS = { 'Mingguan':7, 'Bulanan':30, 'Kuartalan':90, 'Semester':180, 'Tahunan':365 };
function intsOf(id){ return recs('INT').filter(i => i.per === id).sort((a,b) => (a.date||'') < (b.date||'') ? 1 : -1); }
function contactStat(p){
  const ints = intsOf(p.id);
  const last = ints.length && ints[0].date ? ints[0].date : (p.last || '');
  const days = last ? daysBetween(last, todayISO()) : null;
  const target = CADENCE_DAYS[p.cadence] || null;
  const over = (target !== null && days !== null) ? days - target : null;
  let st = 'none';
  if(target){
    if(days === null) st = 'never';
    else if(over > target * 0.5) st = 'cold';
    else if(over > 0) st = 'due';
    else st = 'ok';
  }
  const y1 = shiftISO(todayISO(), -365);
  const recent = ints.filter(i => i.date && i.date >= y1).length;
  return { ints, n: ints.length, last, days, target, over, st, recent,
           tier: recent >= 6 ? 'A' : recent >= 3 ? 'B' : recent >= 1 ? 'C' : 'D' };
}
const ST_LABEL = { never:'Belum pernah dicatat', cold:'Mendingin', due:'Sudah waktunya', ok:'Terjaga', none:'Tanpa ritme' };
const ST_COLOR = { never:'orange', cold:'red', due:'orange', ok:'green', none:'gray' };

function dueContacts(){
  return recs('PER').map(p => Object.assign({ p }, contactStat(p)))
    .filter(x => x.st === 'due' || x.st === 'cold' || x.st === 'never')
    .sort((a,b) => {
      if(a.st === 'never' && b.st !== 'never') return -1;
      if(b.st === 'never' && a.st !== 'never') return 1;
      return (b.over || 0) - (a.over || 0);
    });
}

function promises(){
  return recs('INT').filter(i => i.next && !i.nextDone)

}

function syncLastContact(){
  let changed = false;
  recs('PER').forEach(p => {
    const dates = intsOf(p.id).map(i => i.date).filter(Boolean).sort();
    if(!dates.length) return;
    const mx = dates[dates.length - 1];
    if(!p.last || p.last < mx){ p.last = mx; p._m.updated_at = new Date().toISOString(); changed = true; }
  });
  if(changed) saveStore();
  return changed;
}

function decNeedsReview(){
  const today = todayISO();
  return recs('DEC').filter(d => d.review && !d.reviewed && d.review <= today)
    .sort((a,b) => a.review < b.review ? -1 : 1);
}
function ritStat(r){
  const runs = recs('RUN').filter(x => x.rit === r.id).sort((a,b) => (a.date||'') < (b.date||'') ? 1 : -1);
  const last = runs.length && runs[0].date ? runs[0].date : (r.last || '');
  const days = last ? daysBetween(last, todayISO()) : null;
  const target = FREQ_DAYS[r.freq] || null;
  const over = (target !== null && days !== null) ? days - target : null;
  const paused = r.active === 'Dijeda' || r.active === 'Dihentikan';
  let st = 'ok';
  if(paused) st = 'paused';
  else if(!target) st = 'ok';
  else if(days === null) st = 'never';
  else if(over > target) st = 'broken';
  else if(over >= 0) st = 'due';
  const y90 = shiftISO(todayISO(), -90);
  const recent = runs.filter(x => x.date && x.date >= y90).length;
  const expected = target ? Math.max(1, Math.round(90 / target)) : null;
  return { runs, n: runs.length, last, days, target, over, st, recent, expected,
           keep: expected ? Math.min(100, Math.round(recent / expected * 100)) : null };
}

  if(!all.length) return `<div class="card" style="text-align:center;padding:44px 26px">

  </div>
  <div class="g g21 top" style="margin:0">
    <div class="card">
      ${cardH('target','Hierarki sasaran','gold',`<button class="btn gold sm" onclick="openForm('GOL')">${ic('plus')} Sasaran</button>`)}
      <div class="rows">${roots.map(g => goalRow(g, 0)).join('')}</div>
      ${orphan.length ? `<div class="card-f"><span class="mini">${orphan.length} sasaran jangka pendek belum ditempelkan ke sasaran yang lebih besar — isi kolom "bagian dari sasaran" agar rantainya terlihat.</span></div>` : ''}
    </div>
    <div class="card">
      ${cardH('scale','Sebaran area hidup','purple')}
      ${Object.keys(byArea).sort((a,b) => byArea[b] - byArea[a]).map(k =>
        barLine(k, byArea[k], Math.max(...Object.values(byArea)), 'purple')).join('')}

}

/* ================================================================
   AI CHIEF OF STAFF — dibangun di atas record asli Anda
   Tidak ada jawaban yang dikarang: setiap angka di sini dihitung dari
   record yang Anda entri sendiri, dan sumbernya selalu disebutkan.
   Bila datanya belum ada, sistem mengatakan begitu — bukan menebak.
